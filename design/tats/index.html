.rc-verdict { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rc-verdict > div { display: grid; gap: 4px; padding: 12px 14px; border-radius: 10px; background: var(--soft); }

.rc-meter { display: block; height: 4px; border-radius: 2px; background: var(--soft-strong); overflow: hidden; margin-top: 4px; }

.rc-talk { display: flex; gap: 3px; height: 10px; }

.rc-line { position: relative; height: 36px; margin: 0 14px; }
.rc-line::before { content: ""; position: absolute; left: -14px; right: -14px; top: 50%; height: 2px; margin-top: -1px; background: var(--line-strong); border-radius: 1px; }
.rc-dot { position: absolute; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); box-shadow: 0 0 0 1px var(--line-strong); color: var(--muted); transition: background 0.12s, color 0.12s; }
.rc-dot svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

.rc-keys { display: flex; gap: 14px; }

.rc-keys svg, .rc-mh svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; margin-right: 4px; }
.rc-moment { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 18px 16px; display: grid; gap: 10px; }

  .sb-resize:hover::after, .sb-resize:focus-visible::after, .sb-dragging .sb-resize::after { background: var(--line-strong); }
  .sb-resize:focus-visible { outline: none; }
  /* collapsed: an icon rail */
  .sb-collapsed .side { width: 60px; padding-right: 6px; }
  .sb-collapsed .sb-resize { cursor: default; pointer-events: none; }
  .sb-collapsed .sb-ws { flex-direction: column; align-items: center; gap: 6px; padding: 0; }
  .sb-collapsed .sb-org b, .sb-collapsed .sb-org .chev, .sb-collapsed .sb-ws .icon-btn:not(.sb-toggle) { display: none; }
  .sb-collapsed .sb-org { padding: 4px; justify-content: center; }
  .sb-collapsed .sb-sec, .sb-collapsed .sb-me .grow, .sb-collapsed .sb-faces, .sb-collapsed .sb-agent, .sb-collapsed .sb-item .trunc { display: none; }
  .sb-collapsed .sb-item { justify-content: center; padding: 0; position: relative; }
  .sb-collapsed .sb-item.sub { padding-left: 0; }
  .sb-collapsed .sb-group.shut .sb-item { display: flex; }
  .sb-collapsed .sb-count { position: absolute; top: 3px; right: 4px; min-width: 14px; height: 14px; padding: 0 3px; font-size: 9px; line-height: 14px; border-radius: 7px; background: var(--soft-strong); text-align: center; margin: 0; }
  .sb-collapsed .sb-count.red { background: var(--red); color: #fff; }
  .sb-collapsed .sb-me { justify-content: center; padding-left: 0; padding-right: 0; }
  .sb-collapsed .sb-foot { flex-direction: column; gap: 6px; align-items: center; }
  .sb-collapsed .sb-foot a.sb-help { margin-left: 0; }
  .sb-collapsed .sb-foot .grow { display: none; }
  .sb-toggle.on, .sb-collapsed .sb-toggle { color: var(--ink); }
}
.sb-resize { display: none; }
@media (min-width: 768px) { .sb-resize { display: block; } }
.group-head .toggle { white-space: nowrap; flex-shrink: 0; }
@media (max-width: 767px) { .gh-desc { display: none; } }

/* ================= v38: the post-interview thread, after AffectUI's Ghosted Chat ================= */
.gc { --gc-bubble: var(--paper); --gc-border: #ededed; --gc-shadow: 0 2px 6px rgba(28, 29, 31, 0.08), 0 1px 2px rgba(28, 29, 31, 0.05); --gc-text: #4a4c52; --gc-in: var(--accent);
  flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 16px 16px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow-y: auto; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .gc { --gc-bubble: #232326; --gc-border: rgba(255, 255, 255, 0.08); --gc-shadow: 0 2px 6px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.4); --gc-text: #c4c4c4; } }
:root[data-theme="dark"] .gc { --gc-bubble: #232326; --gc-border: rgba(255, 255, 255, 0.08); --gc-shadow: 0 2px 6px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.4); --gc-text: #c4c4c4; }
.gc-meta { align-self: center; margin: 4px 0 2px; color: var(--faint); font-size: 11.5px; letter-spacing: 0.01em; }
.gc-meta + .gc-row.in { margin-top: 2px; }
.gc-row { display: flex; align-items: flex-end; gap: 8px; }
.gc-row.out { justify-content: flex-end; padding-right: 2px; }
.gc-row.in { justify-content: flex-start; }
.gc-av { width: 24px; flex-shrink: 0; }
.gc-av .av { width: 24px; height: 24px; font-size: 9px; }
.gc-col { display: grid; gap: 3px; min-width: 0; max-width: 78%; }
.gc-name { color: var(--faint); font-size: 11.5px; padding-left: 4px; }
.gc-bubble { max-width: 78%; width: fit-content; padding: 8px 13px; border-radius: 16px 16px 4px 16px; background: var(--gc-bubble); border: 1px solid var(--gc-border); box-shadow: var(--gc-shadow); color: var(--gc-text); font-size: 13.5px; line-height: 1.45; font-weight: 450; }
.gc-bubble.in { max-width: 100%; border-radius: 16px 16px 16px 4px; background: var(--gc-in); border-color: var(--gc-in); color: #fff; font-weight: 500; box-shadow: 0 4px 12px color-mix(in srgb, var(--gc-in) 22%, transparent), 0 1px 2px color-mix(in srgb, var(--gc-in) 18%, transparent); }
.gc-foot { margin-top: auto; padding-top: 10px; color: var(--faint); font-size: 12px; }
.gc-foot b { color: var(--ink); font-weight: 500; }
/* An unanswered nudge: a red shine through the text and a soft glow underneath */
.gc-bubble.last { position: relative; isolation: isolate; margin-bottom: 6px; background: transparent; border-color: transparent; box-shadow: none; }
.gc-bubble.last::before { content: ""; position: absolute; inset: -1px; z-index: -1; background: var(--gc-bubble); border: 1px solid var(--gc-border); border-radius: inherit; box-shadow: var(--gc-shadow); }
.gc-bubble.last::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); width: 100%; height: 22px; background: linear-gradient(90deg, #ffa0ab 0%, #ffb89e 33%, #c8a8e5 66%, #a8b5ff 100%); opacity: 0.55; filter: blur(12px); border-radius: 50%; pointer-events: none; z-index: -2; }
.gc-alert { display: inline; background-image: linear-gradient(90deg, var(--ink) 0%, var(--ink) 38%, #ff4d47 50%, var(--ink) 62%, var(--ink) 100%); background-size: 300% 100%; background-position: 100% 0; background-repeat: no-repeat; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: gcShine 4.5s ease-in-out infinite; }
@keyframes gcShine { 0% { background-position: 100% 0; } 35%, 100% { background-position: 0% 0; } }
/* Messages arrive one by one the first time you open a recording */
.gc[data-play] > * { animation: gcArrive 620ms cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: calc(var(--i, 0) * 260ms + 120ms); }
.gc[data-play] > .gc-meta, .gc[data-play] > .gc-foot { animation-name: gcFade; animation-duration: 500ms; }
.gc-row.out .gc-bubble { transform-origin: 100% 100%; }
.gc-row.in .gc-bubble { transform-origin: 0 100%; }
@keyframes gcArrive { from { opacity: 0; transform: translateY(10px) scale(0.94); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes gcFade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .gc[data-play] > * { animation: none; } .gc-alert { animation: none; background-position: 0% 0; } }
.rc-col > .grow-sec .gc { flex: 1; min-height: 0; }

/* ================= v40: Inbox shows updates only, with an Open / Done switch ================= */
.ib-tabs { margin-left: 4px; }
.ib-tabs button span { margin-left: 6px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ib-note { margin: 0; padding: 10px 20px; border-bottom: 1px solid var(--line); color: var(--faint); font-size: 12.5px; }
.ib-zero.big { padding: 22vh 24px 40px; }
.ib-zero.big p { max-width: 340px; }
.ib-zero-acts { display: flex; gap: 8px; }

/* ================= v41: read card with transcript summary and playable highlights ================= */
.cc-quote { margin: 2px 0 0; font-size: 16px; line-height: 1.5; color: var(--ink); }
.iv-hl { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.hl-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.hl-h b { font-size: 13.5px; font-weight: 500; }
.hl-h a { color: var(--muted); font-size: 12.5px; }
.hl-h a:hover { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-strong); }
.hl-sum { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
.hl-list { display: grid; gap: 2px; margin: 0 -8px; }
.hl-r { position: relative; display: grid; grid-template-columns: 26px 40px 72px minmax(0, 1fr); align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 6px 8px; border-radius: 8px; text-align: left; overflow: hidden; transition: background 0.1s; }
.hl-r:hover, .hl-r.on { background: var(--hover); }
.hl-play { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--ink); }
.hl-play svg { width: 11px; height: 11px; fill: currentColor; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.hl-r.on .hl-play { background: var(--ink); color: var(--paper); }
.hl-t { color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.hl-k { color: var(--muted); font-size: 12.5px; }
.hl-q { font-size: 13.5px; line-height: 1.45; color: var(--ink); }
.hl-bar { position: absolute; left: 8px; right: 8px; bottom: 2px; height: 2px; border-radius: 1px; pointer-events: none; }
.hl-bar b { display: block; width: 0; height: 100%; border-radius: 1px; background: var(--ink); opacity: 0.6; }

/* ================= v42: pick the interviewer yourself ================= */
.as-sec { display: grid; gap: 8px; }
.as-l { color: var(--muted); font-size: 12.5px; }
.as-team em { display: none; }
.as-people { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.as-person { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-strong); cursor: pointer; transition: border-color 0.12s, background 0.12s; }
.as-person:hover { background: var(--hover); }
.as-person input { position: absolute; opacity: 0; pointer-events: none; }
.as-person .av { width: 26px; height: 26px; font-size: 10px; }
.as-person > span { display: grid; line-height: 1.3; min-width: 0; }
.as-person b { font-weight: 500; font-size: 13.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.as-person small { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.as-person em { margin-left: auto; font-style: normal; color: var(--faint); font-size: 11.5px; }
.as-person:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
.as-person:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.as-person.off { cursor: not-allowed; opacity: 0.55; }
.as-person.off:hover { background: none; }

/* ================= v43: motion ================= */
.layer-ghost { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
.layer-ghost > * { pointer-events: none; }

/* ================= v44: Granola notes as questions and answers ================= */
.qa { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.qa-r { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 8px; border-radius: 8px; }
.qa-r + .qa-r { border-top: 1px solid var(--line); border-radius: 0; }
.qa-t { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 3px; }
.qa-b { display: grid; gap: 4px; min-width: 0; }
.qa-q { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; line-height: 1.45; color: var(--ink); }
.qa-q .av { width: 18px; height: 18px; font-size: 7.5px; flex-shrink: 0; margin-top: 1px; }
.qa-q b { font-weight: 500; }
.qa-a { margin: 0 0 0 26px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.qa-k { color: var(--faint); font-size: 12px; padding-top: 2px; white-space: nowrap; }
.qa-r.k-concern .qa-k { color: var(--amber); }
.iv-hl .qa { margin: 0 -8px; }
.rc-col > .grow-sec .qa { flex: 1; overflow-y: auto; }

/* ================= v45: transcript, full Q&A, a clean list to check off ================= */
button.rc-logo { padding: 0; border-radius: 10px; transition: transform 0.12s, box-shadow 0.12s; }
button.rc-logo:hover { box-shadow: 0 0 0 3px var(--soft-strong); }
.qa-more { justify-self: start; margin-top: 2px; }
.linkish { color: var(--muted); font-size: 12.5px; }
.linkish:hover { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-strong); }
.tr { display: grid; gap: 2px; }
.tr-l { display: grid; grid-template-columns: 40px 24px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 4px; border-radius: 8px; }
.tr-l.q { background: var(--surface); }
.tr-t { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.tr-l .av { width: 24px; height: 24px; font-size: 9px; }
.tr-l b { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.tr-l p { margin: 1px 0 0; font-size: 14px; line-height: 1.55; color: var(--ink); }
.tr-l.q p { font-weight: 500; }
/* list: name and verdict, then round · interviewer · date, and a check to mark reviewed */
.ivr { grid-template-columns: 32px minmax(0, 1fr) auto 28px; }
.ivr-l1 { grid-column: 2; grid-row: 1; }
.ivr-v { grid-column: 3; grid-row: 1; }
.ivr-l2 { grid-column: 2 / 4; grid-row: 2; color: var(--faint); }
.ivr-check { grid-column: 4; grid-row: 1 / 3; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 1px var(--line-strong); color: transparent; transition: background 0.12s, color 0.12s; }
.ivr-check svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ivr:hover .ivr-check { color: var(--faint); }
.ivr-check:hover { color: var(--ink) !important; background: var(--soft); }
.ivr-check.on { background: var(--ink); color: var(--paper); box-shadow: none; }
.ivr.rv .ivr-l1 b { color: var(--muted); font-weight: 400; }
.ivr.rv .ivr-v { opacity: 0.6; }

/* v45b: overlays, menus and toasts enter on CSS alone */
@keyframes ov-in { from { opacity: 0; } }
@keyframes dlg-in { from { opacity: 0; transform: translateY(10px) scale(0.97); } }
@keyframes menu-in { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(0.98); } }
@media (prefers-reduced-motion: no-preference) {
  #layer > .overlay { animation: ov-in 0.18s ease-out; }
  #layer > .overlay > :first-child { animation: dlg-in 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); }
  #layer > :not(.overlay):not(.layer-ghost) { animation: menu-in 0.16s ease-out; transform-origin: top left; }
  #toasts > * { animation: toast-in 0.32s cubic-bezier(0.2, 0.8, 0.2, 1); }
}

/* v46: Grokbot Activity = what needs you, then a searchable log */
.af-h { display: flex; align-items: center; gap: 10px; padding: 18px 22px 10px; }
.af-h b { font-size: 15px; font-weight: 600; }
.af-h > span:not(.grow) { color: var(--faint); font-size: 14px; font-variant-numeric: tabular-nums; }
.af-h.log { border-top: 1px solid var(--line); padding-top: 14px; padding-bottom: 14px; }
.af-h .cx-search { height: 34px; width: 320px; }
.af-todo { padding-bottom: 8px; }
.td-r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; margin: 0 12px; padding: 10px 10px; border-radius: 10px; cursor: pointer; }
.td-r:hover { background: var(--hover); }
.td-main { display: grid; gap: 2px; min-width: 0; }
.td-main b { font-size: 14.5px; font-weight: 500; color: var(--ink); }
.td-main span { color: var(--muted); font-size: 13px; }
.td-none { display: flex; align-items: center; gap: 8px; margin: 0; padding: 4px 22px 10px; color: var(--muted); font-size: 14px; }
.td-none .ico { width: 15px; height: 15px; color: var(--ok); }
.af-list { border-top: 1px solid var(--line); }
.af-r { grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; padding: 10px 22px; }
.af-r::before { top: 46px; bottom: -10px; }
.af-l1 { font-size: 14.5px; line-height: 1.4; color: var(--muted); }
.af-t { padding-top: 0; }

/* v48: four pages, four shapes. Pipeline = stage board that fits the window */
.board { width: auto; min-width: 100%; }
.board .col { flex: 1 1 0; width: auto; min-width: 184px; }
.board .card .row { flex-wrap: wrap; }
/* Applicant Tickets = one applicant at a time: a queue strip on top, their document below */
.tk-solo { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
.tk-solo .reader { min-height: 0; border-left: 0; }
.tq { display: flex; align-items: center; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); min-width: 0; }
.tq-n { min-width: 56px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.tq-n b { color: var(--ink); font-weight: 500; }
.tq .icon-btn[disabled] { opacity: 0.35; pointer-events: none; }
.tq-strip { display: flex; gap: 2px; min-width: 0; margin-left: 10px; overflow-x: auto; scrollbar-width: none; }
.tq-c { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px 0 4px; border-radius: 16px; color: var(--muted); font-size: 13.5px; white-space: nowrap; transition: background 0.12s, color 0.12s, opacity 0.18s; }
.tq-c .av { width: 24px; height: 24px; font-size: 9.5px; }
.tq-c:hover { background: var(--hover); color: var(--ink); }
.tq-c.on { background: var(--sel); color: var(--ink); font-weight: 500; }
.tq-c.leaving { opacity: 0; }
.tk.dv-full .tq { display: none; }
/* Inbox = an issue queue: grouped by kind, each row led by what happened, not who */
.ib-gh { display: flex; align-items: center; gap: 8px; padding: 14px 20px 6px; font-size: 13px; font-weight: 500; color: var(--ink); }
.ib-gh span { color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
.ib-k { border-radius: 8px; background: var(--soft); color: var(--muted); }
.ib-k .ico, .ib-k svg { width: 15px; height: 15px; }
.ib-k.blocked { background: var(--red-soft); color: var(--red); }
.ib-k.call { background: var(--accent-soft, var(--sel)); color: var(--accent); }
.ib-what { color: var(--ink); font-weight: 500; font-size: 14px; }
.ib-l2 b { font-weight: 400; color: var(--muted); }
/* Interviews = sentiment first: a bar of how interviews went, then the list grouped by verdict */
.iv-sent { display: grid; gap: 10px; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
.iv-bar { display: flex; gap: 2px; height: 8px; }
.iv-bar i { border-radius: 4px; min-width: 8px; }
.iv-bar i.pass, .iv-key i.pass, .iv-gh i.pass { background: var(--ok); }
.iv-bar i.mixed, .iv-key i.mixed, .iv-gh i.mixed { background: var(--amber); }
.iv-bar i.fail, .iv-key i.fail, .iv-gh i.fail { background: var(--red); }
.iv-bar i.pending, .iv-key i.pending, .iv-gh i.pending { background: var(--line-strong); }
.iv-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.iv-key span { display: inline-flex; align-items: center; gap: 6px; }
.iv-key i, .iv-gh i { width: 8px; height: 8px; border-radius: 50%; }
.iv-key b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.iv-gh { display: flex; align-items: center; gap: 8px; padding: 14px 18px 4px; font-size: 13px; font-weight: 500; color: var(--ink); }
.iv-gh span { color: var(--faint); font-weight: 400; }
/* v49 Inbox: operational issues, each with who it's about and its one action */
.ib.iss { grid-template-columns: 32px minmax(0, 1fr) auto; grid-template-rows: auto auto; padding: 11px 16px 11px 18px; }
.ib.iss .ib-av { grid-column: 1; grid-row: 1 / 3; }
.ib.iss .ib-l1 { grid-column: 2; grid-row: 1; }
.ib.iss .ib-l2 { grid-column: 2; grid-row: 2; display: flex; align-items: center; gap: 0; color: var(--muted); }
.ib.iss .ib-l2 i { font-style: normal; margin: 0 6px; color: var(--faint); }
.ib.iss .ib-l2 b { font-weight: 400; color: var(--muted); }
.ib-who { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); flex-shrink: 0; }
.ib-who .av, .ib-who .bot .av { width: 16px; height: 16px; font-size: 7px; }
.ib-who .bot > i, .ib-who .stackav > :not(:first-child) { display: none; }
.ib-act { grid-column: 3; grid-row: 1 / 3; display: flex; align-items: center; gap: 6px; padding-left: 8px; }
.ib-act .btn.sm { height: 28px; white-space: nowrap; }
.ib-how { color: var(--faint); font-size: 12.5px; white-space: nowrap; }
.ib-k.invite { background: var(--amber-soft); color: var(--amber); }
.ib-k.late { background: var(--amber-soft); color: var(--amber); }
.ib-k.decide { background: var(--soft); color: var(--ink); }
.ib-gh.bot { color: var(--red); }
.draft-card { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.dc-head { display: flex; gap: 12px; align-items: center; }
.dc-head .ib-k { width: 32px; height: 32px; display: grid; place-items: center; flex-shrink: 0; }
.dc-head b { display: block; font-size: 14.5px; font-weight: 500; }
.dc-head span { color: var(--muted); font-size: 13px; }
.dc-mail { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px 10px; margin: 0; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 13px; }
.dc-mail dt { color: var(--faint); }
.dc-mail dd { margin: 0; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dc-body { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink); }
.draft-card .blk-acts { justify-content: flex-end; display: flex; gap: 8px; }
.blk.ok .blk-ico { background: var(--ok-soft); color: var(--ok); }
/* v49 Pipeline at scale: Active and History tabs, capped columns, a paged history table */
.pp-tabs { margin-left: 10px; }
.pp-tabs a span { margin-left: 6px; color: var(--faint); font-variant-numeric: tabular-nums; }
.col-more, .grp-more { margin: 2px 0 4px; height: 30px; border-radius: 6px; color: var(--muted); font-size: 12.5px; text-align: center; }
.col-more:hover, .grp-more:hover { background: var(--hover); color: var(--ink); }
.grp-more { display: block; width: 100%; text-align: left; padding: 0 20px 0 52px; }
.also { display: flex; align-items: center; gap: 8px; margin: 0 16px 8px; padding: 8px 12px; border-radius: 8px; background: var(--soft); color: var(--muted); font-size: 13px; }
.also:hover { color: var(--ink); }
.also .ico { width: 13px; height: 13px; }
.also.in { margin: 0; padding: 4px 10px; background: transparent; }
.h-filters { display: flex; align-items: center; gap: 6px; padding: 0 16px 10px; }
.h-filters .chip.on { background: var(--sel); color: var(--ink); border-color: transparent; }
.htable { display: grid; padding: 0 8px 12px; }
.h-row { display: grid; grid-template-columns: minmax(220px, 2.2fr) minmax(150px, 1.4fr) minmax(170px, 1.3fr) 90px 80px 110px; gap: 12px; align-items: center; min-height: 44px; padding: 4px 12px; border-radius: 8px; font-size: 13.5px; cursor: pointer; }
.h-row:not(.h-head):hover { background: var(--hover); }
.h-head { position: sticky; top: 0; z-index: 1; min-height: 34px; background: var(--paper); border-bottom: 1px solid var(--line); border-radius: 0; cursor: default; }
.h-head button { display: flex; align-items: center; gap: 4px; color: var(--faint); font-size: 12.5px; text-align: left; }
.h-head button.on, .h-head button:hover { color: var(--ink); }
.h-head button i { font-style: normal; }
.h-name { display: grid; min-width: 0; }
.h-name b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-name span, .h-role { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-muted { color: var(--muted); white-space: nowrap; }
.h-out { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--soft); color: var(--muted); font-size: 12px; white-space: nowrap; }
.h-out.ok { background: var(--ok-soft); color: var(--ok); }
.h-out.wait { background: var(--amber-soft); color: var(--amber); }
.h-again { margin-left: 6px; font-size: 12px; color: var(--accent); }
.h-again:hover { text-decoration: underline; }
.h-foot { display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 8px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.h-foot span { margin-right: 8px; }
.h-foot .icon-btn[disabled] { opacity: 0.35; pointer-events: none; }
.h-detail { border-top: 0; }
.h-note { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
.h-note a { color: var(--accent); }
.plan-row .h-out { justify-self: end; }
.past-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 8px; text-align: left; }
.past-row:hover { background: var(--hover); }
.past-row .what { display: grid; gap: 2px; min-width: 0; }
.past-row .what b { font-weight: 500; font-size: 14px; }
.past-row .what span { color: var(--muted); font-size: 13px; }
.h-detail { grid-template-columns: 92px minmax(0, 1fr); }

/* v50: dashboard first, calm color. One accent for the primary action, red only for what's broken. */
.av:not(.cand), .team-key, .tdot, .label i, .handle, .st-ico, .doing, .readpill, .stackav { filter: grayscale(1); }
.qa-r.k-concern .qa-k { color: var(--muted); }
:root { --gc-in: var(--ink); }
.gc-bubble.in { box-shadow: none; }
.vpill { background: var(--soft) !important; color: var(--ink) !important; gap: 6px; }
.vpill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.vpill.pass::before { background: var(--ok); }
.vpill.mixed::before { background: var(--amber); }
.vpill.fail::before { background: var(--red); }
.ib-k, .ib-k.invite, .ib-k.late, .ib-k.decide, .ib-k.call { background: var(--soft); color: var(--muted); }
.ib-k.bot { background: var(--soft); color: var(--red); }
.ib-gh.bot { color: var(--ink); }
.blk.fail .blk-ico, .blk.wait .blk-ico { background: var(--soft); }
.blk.wait .blk-ico { color: var(--muted); }

/* the dashboard strip */
.dk { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin: 4px 16px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); overflow: hidden; }
.dk-i { display: grid; gap: 2px; padding: 12px 16px; border-left: 1px solid var(--line); }
.dk-i:first-child { border-left: 0; }
.dk-i b { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.15; }
.dk-i span { color: var(--muted); font-size: 12.5px; }
.cx-bar + .dk { margin-top: 12px; }

/* calm rows and cards: name, what's happening, who has it */
.trow.arow2.calm { grid-template-columns: 14px 16px minmax(0, 1fr) minmax(120px, 240px) 28px 36px; column-gap: 12px; }
.trow.arow2.calm .st-ico { display: grid; place-items: center; }
.doing-t { color: var(--muted); font-size: 13px; }
.board .card.calm { display: grid; gap: 3px; padding: 11px 12px; }
.board .card.calm .name { font-size: 14px; }
.board .card.calm .hl { font-size: 12.5px; color: var(--muted); margin: 0; }
.cfoot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; color: var(--muted); font-size: 12.5px; }
.cfoot .av, .cfoot .bot .av { width: 20px; height: 20px; font-size: 8px; }
.cfoot .stackav > :not(:first-child) { display: none; }

/* Inbox rows carry no buttons; the reader has the one action, and Grokbot does the rest */
.ib-t2 { color: var(--faint); font-size: 12.5px; white-space: nowrap; }
.askbar { display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; margin: 12px 0 4px; padding: 0 14px 0 8px; border: 1px solid var(--line); border-radius: 21px; color: var(--faint); font-size: 13.5px; text-align: left; transition: border-color 0.12s, color 0.12s; }
.askbar:hover { border-color: var(--line-strong); color: var(--muted); }
.askbar .bot .av { width: 26px; height: 26px; font-size: 10px; }
.tk-acts .cx-btn .bot .av { width: 18px; height: 18px; font-size: 7px; }
.tk-acts .cx-btn .bot > i { display: none; }
.gc { --gc-in: var(--ink); }
.rc-talk i.c { background: var(--ink) !important; }
.rc-talk i.v { background: var(--line-strong) !important; }
.sugg { background: var(--soft) !important; color: var(--muted) !important; }
/* v51 Inbox: up to the top, more air between issues */
.ib-list { padding: 6px 8px 24px; }
.ib-gh { padding: 22px 12px 8px; font-size: 12.5px; color: var(--muted); }
.ib-gh:first-child { padding-top: 10px; }
.ib-gh span { margin-left: -2px; }
.ib.iss { padding: 14px 12px; row-gap: 5px; column-gap: 14px; border-radius: 10px; }
.ib.iss + .ib.iss { margin-top: 2px; }
.ib.iss .ib-what { font-size: 14.5px; }
.ib.iss .ib-l2 { font-size: 13px; }
.ib-k { width: 34px; height: 34px; border-radius: 9px; }
.ib-read { padding-top: 32px; }
.ib-head { margin-bottom: 20px; }
.ib-read > .blk, .ib-read > .draft-card { margin-bottom: 4px; }
.ib-read .askbar { margin: 14px 0 28px; }

/* v52 Interviews: the loop as a tree. Candidate on the left, rounds in the middle, who ran each on the right. */
.pt { position: relative; display: grid; grid-template-columns: minmax(230px, 280px) 48px minmax(140px, 180px) 32px minmax(190px, 260px); grid-auto-rows: 44px; row-gap: 10px; align-items: center; padding: 22px 24px 24px; border-bottom: 1px solid var(--line); }
.pt-lines { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.pt-lines path { fill: none; stroke: var(--line-strong); stroke-width: 1.25; }
.pt-lines path.ghost { opacity: 0.45; }
.pt-lines path.hot { stroke: var(--accent); stroke-width: 1.5; }
.pt-left { grid-column: 1; align-self: center; display: grid; gap: 8px; justify-items: start; position: relative; z-index: 1; }
.pt-tag { height: 24px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 6px; background: var(--soft); color: var(--muted); font-size: 12.5px; font-weight: 500; }
.pt-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.pt-card b { display: block; font-size: 14.5px; font-weight: 500; }
.pt-card > div span { color: var(--muted); font-size: 12.5px; }
.pt-card p { grid-column: 1 / -1; margin: 8px 0 0; font-size: 14px; line-height: 1.45; color: var(--ink); font-weight: 500; }
.pt-n { position: relative; z-index: 1; display: flex; align-items: center; gap: 9px; height: 44px; min-width: 0; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font-size: 13.5px; }
.pt-n.round { grid-column: 3; }
.pt-n.iv { grid-column: 5; }
a.pt-n:hover { border-color: var(--line-strong); }
.pt-n b { font-weight: 500; white-space: nowrap; }
.pt-n em { margin-left: auto; font-style: normal; color: var(--accent); font-size: 12.5px; }
.pt-n em.off { color: var(--faint); }
.pt-num { width: 20px; height: 20px; flex-shrink: 0; display: grid; place-items: center; border-radius: 5px; background: var(--soft); color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.pt-num .ico, .pt-num svg { width: 11px; height: 11px; }
.pt-n.cur { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 14%, transparent); }
.pt-n.next, .pt-n.closed { opacity: 0.45; }
.pt-n .av { width: 24px; height: 24px; font-size: 9.5px; }
.pt-who { display: grid; min-width: 0; line-height: 1.25; }
.pt-who b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.pt-who > span { color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.pt-v::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.pt-v.pass::before { background: var(--ok); }
.pt-v.mixed::before { background: var(--amber); }
.pt-v.fail::before { background: var(--red); }
.pt-d { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }

/* v53 CRM: one database of everyone the funnel closed */
.crm-tabs { display: flex; gap: 2px; padding: 0 16px 10px; border-bottom: 1px solid var(--line); }
.crm-tab { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 8px; color: var(--muted); font-size: 13.5px; }
.crm-tab span { color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.crm-tab:hover { background: var(--hover); color: var(--ink); }
.crm-tab.on { background: var(--sel); color: var(--ink); font-weight: 500; }
.crm { flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 14px 16px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); overflow: hidden; }
.crm .scroll { flex: 1; min-height: 0; }
.crm-head { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 12px 0 18px; border-bottom: 1px solid var(--line); }
.crm-head > .ico { width: 16px; height: 16px; color: var(--muted); }
.crm-head b { font-size: 15px; font-weight: 600; }
.crm-ask { display: flex; align-items: center; gap: 8px; width: min(440px, 50%); height: 36px; padding: 0 4px 0 6px; border: 1px solid var(--line); border-radius: 18px; transition: border-color 0.12s, box-shadow 0.12s; }
.crm-ask:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
.crm-ask .bot .av { width: 24px; height: 24px; font-size: 9px; }
.crm-ask .bot > i { display: none; }
.crm-ask input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 13.5px; color: var(--ink); }
.crm-ask .btn { height: 28px; border-radius: 14px; white-space: nowrap; }
.crm-t { display: grid; min-width: 1000px; }
.crm-r { display: grid; grid-template-columns: 44px minmax(200px, 1.6fr) minmax(170px, 1.3fr) minmax(130px, 1fr) minmax(120px, 0.9fr) 90px minmax(160px, 1.1fr) 110px; align-items: center; min-height: 50px; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.crm-r > * { padding: 0 14px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 1px solid var(--line); height: 100%; display: flex; align-items: center; }
.crm-r > :first-child { border-left: 0; justify-content: center; padding: 0; }
.crm-r:not(.crm-h):hover { background: var(--hover); }
.crm-r.picked { background: var(--sel); }
.crm-h { position: sticky; top: 0; z-index: 1; min-height: 46px; background: var(--paper); cursor: default; }
.crm-hc { gap: 8px; color: var(--muted); font-size: 13.5px; text-align: left; }
.crm-hc .ico { width: 14px; height: 14px; color: var(--faint); }
.crm-hc.on, .crm-hc:hover { color: var(--ink); }
.crm-hc i { font-style: normal; margin-left: 2px; }
.ck { width: 16px; height: 16px; border-radius: 4px; box-shadow: inset 0 0 0 1.25px var(--line-strong); }
.ck.on { background: var(--accent); box-shadow: none; position: relative; }
.ck.on::after { content: ""; position: absolute; left: 5px; top: 2px; width: 4px; height: 8px; border: solid #fff; border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); }
.crm-name { gap: 10px; }
.crm-name .av { width: 24px; height: 24px; font-size: 9.5px; flex-shrink: 0; }
.crm-name b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.crm-tag { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 6px; background: var(--soft); color: var(--ink); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
.crm-link { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.crm-num, .crm-day { font-variant-numeric: tabular-nums; }
.crm-foot { display: flex; align-items: center; gap: 4px; height: 46px; padding: 0 12px 0 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.crm-foot > span:not(.grow) { margin-right: 8px; }
.crm-foot .icon-btn[disabled] { opacity: 0.35; pointer-events: none; }
/* the Slack post Grokbot will send */
.slk { margin-top: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
.slk-m { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
.slk-m .bot .av { width: 36px; height: 36px; border-radius: 8px; font-size: 12px; }
.slk-n { display: flex; align-items: baseline; gap: 6px; font-size: 14px; }
.slk-n span { padding: 0 4px; border-radius: 3px; background: var(--soft); color: var(--muted); font-size: 10.5px; font-weight: 600; }
.slk-n time { color: var(--faint); font-size: 12px; }
.slk-b p { margin: 4px 0; font-size: 14px; line-height: 1.5; color: var(--ink); }
.slk-b ol { margin: 4px 0 6px; padding-left: 20px; font-size: 13.5px; line-height: 1.7; color: var(--ink); }
.slk-b ol b { font-weight: 600; }
.slk-more { color: var(--muted) !important; }
.crm-r { grid-template-columns: 44px minmax(170px, 1.5fr) minmax(150px, 1.2fr) minmax(120px, 1fr) minmax(110px, 1fr) 108px minmax(150px, 1fr) 104px; }
.crm-t { min-width: 960px; }
.crm-r { grid-template-columns: 44px minmax(170px, 1.5fr) minmax(150px, 1.2fr) minmax(120px, 1fr) minmax(110px, 1fr) 104px minmax(150px, 1fr) 128px; }
.slk-m .bot > i { display: none; }
.crm-r { grid-template-columns: 44px minmax(170px, 1.5fr) minmax(150px, 1.2fr) minmax(110px, 0.9fr) minmax(110px, 0.9fr) 100px minmax(178px, 1.1fr) 124px; }

/* v55: the next move on an applicant ticket glows, so it reads as the thing to do */
.act-glow { --glow: #f5b83d; position: relative; border-radius: 10px; background: color-mix(in srgb, var(--glow) 10%, var(--paper)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--glow) 70%, transparent), 0 0 0 4px color-mix(in srgb, var(--glow) 18%, transparent), 0 0 18px 2px color-mix(in srgb, var(--glow) 35%, transparent); }
.act-glow button.on { background: var(--paper); box-shadow: 0 1px 2px rgba(120, 80, 0, 0.18), 0 0 0 1px color-mix(in srgb, var(--glow) 55%, transparent); }
@media (prefers-reduced-motion: no-preference) {
  .act-glow { animation: actGlow 2.4s ease-in-out infinite; }
  @keyframes actGlow {
    0%, 100% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--glow) 70%, transparent), 0 0 0 4px color-mix(in srgb, var(--glow) 16%, transparent), 0 0 14px 1px color-mix(in srgb, var(--glow) 28%, transparent); }
    50% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--glow) 85%, transparent), 0 0 0 5px color-mix(in srgb, var(--glow) 24%, transparent), 0 0 24px 4px color-mix(in srgb, var(--glow) 45%, transparent); }
  }
}
/* No glow: the picked move just carries the hover highlight. */
.act-glow, .act-glow:hover { background: none; box-shadow: none; animation: none; }
.act-glow button.on { background: var(--hover); border-color: var(--line-strong); box-shadow: none; }

/* v56: off-white surfaces, darker hairlines, and shading that says where one pane ends */
:root {
  --frame: #ededea;
  --surface: #f7f7f4;
  --paper: #fafaf8;
  --raised: #ffffff;
  --line: #e1e1dc;
  --line-strong: #cfcfc9;
  --soft: #efefeb;
  --soft-strong: #e5e5e0;
  --band: #f1f1ed;
  --pane: #f3f3ef;
  --hover: rgba(40, 35, 20, 0.045);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pane: #18181b; } }
:root[data-theme="dark"] { --pane: #18181b; }
/* list on the left stays light; the reader is one shade down; cards inside it are white */
.ib-col, .tk .mlist, .ivw-list { background: var(--paper); border-right: 1px solid var(--line-strong); }
.ib-reader, .tk .reader, .ivw-read { background: var(--pane); }
.ib-top { background: var(--pane); border-bottom-color: var(--line-strong); }
.ib-read .blk, .ib-read .draft-card, .ib-read .askbar { background: var(--raised); }
.ib-read .askbar { border-color: var(--line-strong); }
.cx-bar, .bar { border-bottom: 1px solid var(--line); }
.ib-bar { border-bottom-color: var(--line-strong); }
/* Applicant Tickets: back to an email-style list */
.tk .mrow { grid-template-columns: 36px minmax(0, 1fr); column-gap: 12px; row-gap: 2px; align-items: center; padding: 12px 12px; }
.tk .mrow > .av { grid-row: 1 / 3; width: 36px; height: 36px; font-size: 12px; }
.tk .mrow .m1, .tk .mrow .m2 { grid-column: 2; }
.tk .mrow.sel { background: var(--sel); }

/* v57 spacing: one scale everywhere.
   4  helper text under its control
   8  title → subtitle, label → control, stacked buttons and cards
   12/16  padding inside rows and cards
   20  between related fields and groups
   24  between sections, and the gutter of every page */
:root { --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; }

/* page headers and the bar under them */
.bar, .cx-bar { min-height: 52px; padding-left: var(--s6); padding-right: var(--s4); gap: var(--s2); }
.subbar { padding: var(--s3) var(--s6); }

/* sheets and forms */
.fm-head { padding: var(--s6) var(--s6) 0; gap: var(--s4); }
.fm-head p { margin-top: var(--s2); }
.fm-body { padding: var(--s6); gap: var(--s5); }
.fm-f { gap: var(--s2); }
.fm-row { gap: var(--s4); }
.modal-foot { padding: var(--s4) var(--s6); gap: var(--s2); }

/* sidebar: 24 between groups, 8 under a group's label */
.sb-ws { margin-bottom: var(--s6); }
.sb-group + .sb-group { margin-top: var(--s6); }
.sb-sec { margin-bottom: 6px; }

/* Inbox */
.ib-list { padding: var(--s2) var(--s2) var(--s6); }
.ib-gh { padding: var(--s6) var(--s3) var(--s2); }
.ib-gh:first-child { padding-top: var(--s2); }
.ib.iss { padding: var(--s3); row-gap: var(--s1); }
.ib.iss + .ib.iss { margin-top: 2px; }
.ib-read { padding: var(--s6) var(--s6) 40px; }
.ib-read > * { margin-top: 0; margin-bottom: 0; }
.ib-read > * + * { margin-top: var(--s6); }
.ib-read > .askbar { margin-top: var(--s2); }
.ib-head { margin-bottom: 0; }
.ib-head p { margin: var(--s2) 0 0; }
.ib-top { padding: 0 var(--s4) 0 var(--s6); }

/* Applicant Tickets */
.tk .mlist { padding: var(--s2); gap: 2px; }
.tk .mrow { padding: var(--s3); }

/* ticket page: 24 between blocks, 20 from the title to its properties */
.body > * { margin-top: 0; margin-bottom: 0; }
.body > * + * { margin-top: var(--s6); }
.body > .t-head + .chips { margin-top: var(--s5); }
.block-head { margin-bottom: var(--s2); }

/* Pipeline board: 8 between cards, 4 from a name to its line, 8 to the footer */
.board { gap: var(--s2); padding: 0 var(--s6) var(--s6); }
.board .col { gap: var(--s2); padding: var(--s1); }
.board .card.calm { gap: var(--s1); padding: var(--s3); }
.cfoot { margin-top: var(--s1); }
.list { padding-bottom: var(--s6); }

/* Interviews */
.ivw-list { padding: var(--s2) 0 var(--s6); }
.iv-sent { padding: var(--s4) var(--s6) var(--s4); gap: var(--s2); }
.iv-gh { padding: var(--s6) var(--s6) var(--s2); }
.ivr { padding: var(--s3) var(--s6); }
.ivw-read { padding: var(--s4); }
.pt { padding: var(--s6); row-gap: var(--s2); }
.pt-left { gap: var(--s2); }
.rc-sec { padding: var(--s5) var(--s6); gap: var(--s3); }

/* Grokbot Activity */
.af-h { padding: var(--s6) var(--s6) var(--s2); gap: var(--s2); }
.af-h.log { padding: var(--s4) var(--s6); }
.td-r { margin: 0 var(--s3); padding: var(--s3); }
.af-r { padding: var(--s3) var(--s6); }
.af-day { padding: var(--s6) var(--s6) var(--s2); }

/* CRM */
.crm-tabs { padding: var(--s3) var(--s6); gap: var(--s1); }
.crm { margin: var(--s5) var(--s6) var(--s6); }
.crm-head { padding: 0 var(--s3) 0 var(--s5); gap: var(--s2); }
.crm-foot { padding: 0 var(--s3) 0 var(--s5); }
.ib-read > .askbar.askbar { margin: var(--s2) 0 0; }
.ib-read > .block.ib-story { margin-top: var(--s6); }

/* v58 Inbox gestures: the row slides over a track that says what letting go will do */
.sw { position: relative; border-radius: 10px; overflow: hidden; }
.sw + .sw { margin-top: 2px; }
.sw .ib.iss { position: relative; z-index: 1; background: var(--paper); touch-action: pan-y; will-change: transform; }
.sw .ib.iss:hover { background: color-mix(in srgb, var(--ink) 4%, var(--paper)); }
.sw .ib.iss.sel { background: var(--sel); }
.sw-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 13.5px; font-weight: 500; color: var(--muted); background: var(--soft); opacity: 0; transition: background 0.15s, color 0.15s; }
.sw.go-l .sw-bg, .sw.go-r .sw-bg { opacity: 1; }
.sw-bg span { display: inline-flex; align-items: center; gap: 8px; opacity: 0; transition: opacity 0.12s; }
.sw-bg .ico { width: 15px; height: 15px; }
.sw.go-l .sw-l, .sw.go-r .sw-r { opacity: 1; }
.sw.go-l.armed .sw-bg { background: var(--accent); color: #fff; }
.sw.go-r.armed .sw-bg { background: var(--ink); color: var(--paper); }
@media (min-width: 768px) { .ib-top:not(:has(.cx-btn)) { display: none; } }
.sw { user-select: none; -webkit-user-select: none; }

/* v59 Home: Recruiting Overview. White cards on the off-white page, one accent, red only past a target. */
.hm-bar .chip { height: 32px; }
.hm-bar .chip.on { background: var(--sel); color: var(--ink); border-color: transparent; }
.hm-nav { display: flex; gap: var(--s1); padding: var(--s3) var(--s6); border-bottom: 1px solid var(--line); }
.hm-nav a { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; color: var(--muted); font-size: 13.5px; }
.hm-nav a:hover { background: var(--hover); color: var(--ink); }
.hm-nav a.on { background: var(--sel); color: var(--ink); font-weight: 500; }
.hm { display: grid; gap: var(--s4); padding: var(--s6); }
.hm-grid6 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s4); }
.hm-row { display: grid; gap: var(--s4); align-items: start; }
.hm-row.two { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.hm-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.hm-card, .hm-box { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; }
.hm-card { display: grid; gap: var(--s2); padding: var(--s5); }
.hm-l { width: fit-content; color: var(--muted); font-size: 13.5px; text-decoration: underline dotted var(--line-strong); text-underline-offset: 4px; cursor: help; }
.hm-v { display: flex; align-items: baseline; gap: var(--s2); }
.hm-v b { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.hm-d { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.hm-d.good { color: var(--ok); }
.hm-d.bad { color: var(--red); }
.hm-bars { margin-left: auto; align-self: flex-end; display: flex; align-items: flex-end; gap: 3px; height: 30px; }
.hm-bars i { width: 5px; border-radius: 2px; background: var(--soft-strong); }
.hm-bars i.now { background: var(--muted); }
.hm-card.over .hm-bars i.now { background: var(--red); }
.hm-f { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: var(--s1); padding-top: var(--s3); border-top: 1px solid var(--line); }
.hm-t { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px dashed var(--line-strong); color: var(--faint); font-size: 12.5px; }
.hm-t.set { border-style: solid; color: var(--muted); background: var(--soft); border-color: transparent; }
.hm-t:hover { color: var(--ink); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.hm-go { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: 13px; font-weight: 500; white-space: nowrap; }
.hm-go .ico { width: 13px; height: 13px; }
.hm-go:hover { text-decoration: underline; text-underline-offset: 3px; }
.hm-box { padding: var(--s5); display: grid; gap: var(--s2); }
.hm-h { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s1); }
.hm-h b { font-size: 14.5px; font-weight: 600; }
.hm-h b[title] { text-decoration: underline dotted var(--line-strong); text-underline-offset: 4px; cursor: help; }
.hm-h > span { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
.hm-h .hm-go { margin-left: auto; }
.hm-none { margin: 0; color: var(--muted); font-size: 13.5px; }
/* bottlenecks */
.hm-bn { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s3); margin: 0 calc(-1 * var(--s3)); border-radius: 10px; }
.hm-bn:hover { background: var(--hover); }
.hm-ic { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; background: var(--soft); color: var(--muted); }
.hm-ic .ico { width: 15px; height: 15px; }
.hm-bn.over .hm-ic { color: var(--red); }
.hm-bn-m { display: grid; gap: 2px; min-width: 0; }
.hm-bn-m b { font-size: 14px; font-weight: 500; }
.hm-bn-m span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
/* new applications by role */
.hm-role { display: grid; gap: 6px; padding: 6px 0; }
.hm-role div { display: flex; justify-content: space-between; font-size: 13.5px; }
.hm-role b { font-weight: 500; font-variant-numeric: tabular-nums; }
.hm-role i { height: 6px; border-radius: 3px; background: var(--accent); }
/* time in stage */
.hm-st-head, .hm-st { display: grid; grid-template-columns: minmax(0, 1.4fr) 90px minmax(0, 1.6fr) 80px; gap: var(--s3); align-items: center; }
.hm-st-head { padding: 0 var(--s2) var(--s1); color: var(--faint); font-size: 12.5px; border-bottom: 1px solid var(--line); }
.hm-st { min-height: 44px; padding: 0 var(--s2); border-radius: 8px; font-size: 13.5px; text-align: left; }
.hm-st:not([disabled]):hover, .hm-st.on { background: var(--hover); }
.hm-st[disabled] { color: var(--faint); cursor: default; }
.hm-st > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
.hm-st .ico { width: 13px; height: 13px; color: var(--faint); }
.hm-st b { font-weight: 500; font-variant-numeric: tabular-nums; }
.hm-st-w { display: flex; align-items: center; gap: var(--s2); }
.hm-st-w i { height: 8px; min-width: 2px; border-radius: 4px; background: var(--ink); opacity: 0.75; }
.hm-st-w em, .hm-st-max { font-style: normal; color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hm-st-list { display: grid; margin: 0 0 var(--s2) 22px; padding-left: var(--s3); border-left: 1px solid var(--line); }
.hm-st-list a { display: grid; grid-template-columns: 22px auto minmax(0, 1fr) auto; gap: var(--s2); align-items: center; padding: 6px var(--s2); border-radius: 6px; font-size: 13px; }
.hm-st-list a:hover { background: var(--hover); }
.hm-st-list .av { width: 22px; height: 22px; font-size: 8.5px; }
.hm-st-list b { font-weight: 500; }
.hm-st-list span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm-st-list em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.hm-more { display: inline-flex; align-items: center; gap: 6px; padding: 6px var(--s2); color: var(--accent); font-size: 13px; }
.hm-more .ico { width: 12px; height: 12px; }
/* lists: offers, scorecards */
.hm-li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: var(--s3); align-items: center; padding: var(--s2) 0; font-size: 13.5px; }
a.hm-li:hover b { text-decoration: underline; text-underline-offset: 3px; }
.hm-li .av { width: 28px; height: 28px; font-size: 10px; }
.hm-li > span { display: grid; min-width: 0; }
.hm-li b { font-weight: 500; }
.hm-li > span > span { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm-li em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hm-li .btn.sm { height: 26px; }
.hm-quiet .hm-h b { font-weight: 500; color: var(--muted); }
/* interviewers */
.hm-iv { display: grid; grid-template-columns: 24px 64px minmax(0, 1fr) 44px 44px; gap: var(--s2); align-items: center; padding: 5px 0; font-size: 13.5px; }
.hm-iv .av { width: 24px; height: 24px; font-size: 9px; }
.hm-iv-b { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.hm-iv-b i { display: block; height: 100%; border-radius: 4px; background: var(--muted); }
.hm-iv em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
.hm-iv-o { color: var(--red); font-size: 12px; text-align: right; }
/* outcomes: pending is its own thing, not a fail */
.hm-oc-bar { display: flex; gap: 2px; height: 10px; margin: var(--s1) 0 var(--s2); }
.hm-oc-bar i { border-radius: 5px; min-width: 6px; }
.hm-oc-bar i.pass, .hm-oc-k.pass { background: var(--ok); }
.hm-oc-bar i.mixed, .hm-oc-k.mixed { background: var(--amber); }
.hm-oc-bar i.fail, .hm-oc-k.fail { background: var(--red); }
.hm-oc-bar i.pending { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.hm-oc { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto 44px; gap: var(--s2); align-items: center; padding: 5px 0; font-size: 13.5px; }
.hm-oc-k { width: 10px; height: 10px; border-radius: 50%; display: grid; place-items: center; }
.hm-oc-k.pending { width: 16px; height: 16px; background: transparent; color: var(--muted); }
.hm-oc-k.pending .ico { width: 13px; height: 13px; }
.hm-oc b { font-weight: 500; font-variant-numeric: tabular-nums; }
.hm-oc em { font-style: normal; color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 1100px) { .hm-grid6, .hm-row.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hm-row.two { grid-template-columns: minmax(0, 1fr); } }
.hm-st-list a.hm-more { display: inline-flex; grid-template-columns: none; width: fit-content; }

/* v60 Inbox: letter-key buttons, like Superhuman. The label, then the key that does the same. */
.kb { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background 0.12s, border-color 0.12s; }
.kb:hover { background: var(--soft); }
.kb kbd, .btn kbd, .cx-primary kbd { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 4px; background: var(--soft); color: var(--muted); font: 500 11px/1 var(--sans); box-shadow: inset 0 -1px 0 var(--line-strong); }
.btn kbd { margin-left: 6px; }
.kb.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.kb.primary:hover { filter: brightness(1.05); }
.kb.primary kbd, .btn.primary kbd { background: rgba(255, 255, 255, 0.2); color: #fff; box-shadow: none; }
.kb-bar { display: flex; flex-wrap: wrap; gap: var(--s2); }
.ib-read > .kb-bar { margin-top: var(--s5); }
.ib-read .blk .blk-acts, .ib-read .draft-card .blk-acts { display: none; }
.ib-keys { display: none; gap: 6px; }
.ib-keys .kb { height: 26px; padding: 0 4px 0 9px; font-size: 12.5px; gap: 6px; }
.ib-keys .kb kbd { min-width: 16px; height: 16px; font-size: 10.5px; }
.ib.iss:hover .ib-keys, .ib.iss.sel .ib-keys { display: inline-flex; }
.ib.iss:hover .ib-t2, .ib.iss.sel .ib-t2 { display: none; }

/* v60 Overview charts: every bar is real. Card histograms of how long open items have waited; daily applications. */
.hm-ctx { display: flex; align-items: baseline; gap: var(--s2); margin-top: -4px; }
.hm-sub { color: var(--muted); font-size: 12.5px; }
.hm-v .hm-sub { margin-left: 2px; }
.hm-hist { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; height: 64px; margin-top: var(--s2); }
.hm-hist > span { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 4px; min-width: 0; cursor: default; }
.hm-hist i { align-self: end; width: 100%; border-radius: 3px 3px 1px 1px; background: var(--soft-strong); transition: background 0.12s; }
.hm-hist > span:hover i { background: var(--muted); }
.hm-hist i.over, .hm-hist i.low { background: color-mix(in srgb, var(--red) 70%, var(--paper)); }
.hm-hist em { font-style: normal; color: var(--faint); font-size: 11px; text-align: center; white-space: nowrap; }
.hm-bars { display: none; }
.hm-st-key { display: flex; gap: var(--s4); margin: -4px 0 var(--s1); color: var(--muted); font-size: 12.5px; }
.hm-st-key span { display: inline-flex; align-items: center; gap: 6px; }
.hm-st-key i, .hm-st-bar i { display: block; }
.hm-st-key i { width: 10px; height: 10px; border-radius: 3px; }
.s0 { background: var(--soft-strong); }
.s1 { background: color-mix(in srgb, var(--ink) 45%, var(--paper)); }
.s2 { background: var(--ink); }
.hm-st-bar { display: flex; gap: 2px; height: 10px; min-width: 4px; }
.hm-st-bar i { height: 100%; border-radius: 2px; min-width: 3px; }
.hm-st-w { display: flex; align-items: center; gap: var(--s3); }

/* v60 Referrals */
.ref-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--s4); padding: var(--s5) var(--s6) var(--s6); }
.ref-wrap .crm { margin: 0; }
.rf-r { grid-template-columns: minmax(200px, 1.5fr) minmax(170px, 1.2fr) minmax(170px, 1.2fr) minmax(150px, 1fr) 110px; }
.rf-r > :first-child { justify-content: flex-start; padding: 0 14px; border-left: 0; }
.ref-t .crm-t { min-width: 760px; }
.crm-own .av { width: 22px; height: 22px; font-size: 8.5px; margin-right: 8px; flex-shrink: 0; }
.h-out.live { background: var(--sel); color: var(--ink); }
.ref-side { align-self: start; }
.ref-lb-h, .ref-lb { display: grid; grid-template-columns: 26px minmax(0, 1fr) 54px 64px 40px; gap: var(--s2); align-items: center; }
.ref-lb-h { color: var(--faint); font-size: 12px; padding-bottom: var(--s1); border-bottom: 1px solid var(--line); }
.ref-lb-h span:not(:first-child) { text-align: right; }
.ref-lb { padding: 6px 0; font-size: 13.5px; }
.ref-lb .av { width: 26px; height: 26px; font-size: 9.5px; }
.ref-lb-n { display: grid; gap: 4px; min-width: 0; }
.ref-lb-n b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ref-lb-n i { display: block; height: 4px; border-radius: 2px; background: var(--soft-strong); }
.ref-lb em { font-style: normal; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.ref-lb em.hired { color: var(--ok); font-weight: 500; }
.bar .btn .bot .av { width: 18px; height: 18px; font-size: 7px; }
.bar .btn .bot > i { display: none; }
.bar .btn.sm { gap: 6px; }
.ref-wrap { grid-template-columns: minmax(0, 1fr) 300px; }
.rf-r { grid-template-columns: minmax(170px, 1.4fr) minmax(150px, 1.2fr) minmax(140px, 1.1fr) minmax(130px, 1fr) 96px; }
.ref-t .crm-t { min-width: 700px; }
.ref-lb-h, .ref-lb { grid-template-columns: 26px minmax(0, 1fr) 40px 50px 34px; gap: 6px; }

/* v60 sidebar foot: chat with your Grokbot, and the tutorial */
.sb-chat { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; margin: var(--s2) 0; padding: 0 12px 0 8px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink); font-size: 13.5px; font-weight: 500; text-align: left; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
.sb-chat:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line-strong)); }
.sb-chat.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
.sb-chat .bot .av { width: 24px; height: 24px; font-size: 9px; }
.sb-tour { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; color: var(--muted); font-size: 13px; }
.sb-tour:hover { background: var(--hover); color: var(--ink); }
.sb-tour .ico { width: 14px; height: 14px; }
.sb-collapsed .sb-chat span, .sb-collapsed .sb-tour { font-size: 0; gap: 0; }

/* Chat: a Slack DM */
.chat-bar .crumbs .bot .av { width: 22px; height: 22px; font-size: 8.5px; }
.chat-slack { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; background: var(--soft); color: var(--muted); font-size: 12.5px; }
.chat-slack svg { width: 13px; height: 13px; }
.chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s4) var(--s6) var(--s6); }
.chat-day { display: flex; align-items: center; gap: var(--s3); margin: var(--s4) 0 var(--s2); color: var(--muted); font-size: 12.5px; font-weight: 500; }
.chat-day::before, .chat-day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.chat-m { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: var(--s3); padding: var(--s2) var(--s2); margin: 0 calc(-1 * var(--s2)); border-radius: 8px; max-width: 760px; }
.chat-m:hover { background: var(--hover); }
.chat-m.cont { padding-top: 2px; }
.chat-m > .av, .chat-m > .bot .av { width: 36px; height: 36px; border-radius: 8px; font-size: 12px; }
.chat-m > .bot > i { display: none; }
.chat-n { display: flex; align-items: baseline; gap: 6px; font-size: 14px; }
.chat-n .app { padding: 0 4px; border-radius: 3px; background: var(--soft); color: var(--muted); font-size: 10.5px; font-weight: 600; }
.chat-n time { color: var(--faint); font-size: 12px; }
.chat-t { font-size: 14.5px; line-height: 1.5; color: var(--ink); }
.chat-b ul { margin: 4px 0 0; padding-left: 20px; font-size: 14px; line-height: 1.65; }
.chat-btns { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s2); }
.slk-btn { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink); font-size: 13px; font-weight: 600; }
.slk-btn:hover { background: var(--soft); }
.slk-btn.primary { background: #007a5a; border-color: #007a5a; color: #fff; }
.chat-compose { display: flex; align-items: flex-end; gap: var(--s2); margin: 0 var(--s6) var(--s6); padding: var(--s2) var(--s2) var(--s2) var(--s4); border: 1px solid var(--line-strong); border-radius: 12px; background: var(--raised); }
.chat-compose:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
.chat-compose textarea { flex: 1; min-height: 24px; max-height: 160px; padding: 6px 0; border: 0; outline: none; resize: none; background: transparent; font: inherit; font-size: 14.5px; color: var(--ink); field-sizing: content; }

/* Tutorial: shade everything but the part being explained */
#tour { position: fixed; inset: 0; z-index: 300; }
.tour-block { position: absolute; inset: 0; }
.tour-spot { position: absolute; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(18, 18, 22, 0.55), 0 0 0 2px #fff, 0 0 0 6px color-mix(in srgb, var(--accent) 55%, transparent); transition: left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), height 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); pointer-events: none; }
.tour-card { position: absolute; width: 320px; padding: var(--s5); border-radius: 14px; background: var(--raised); box-shadow: var(--pop-shadow); transition: left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
.tour-step { color: var(--accent); font-size: 12.5px; font-weight: 500; }
.tour-card h3 { margin: var(--s2) 0 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.tour-card p { margin: var(--s2) 0 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
.tour-acts { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s5); }
@media (prefers-reduced-motion: reduce) { .tour-spot, .tour-card { transition: none; } }

/* v61 Overview: KPI row, the stuck view, a secondary grid */
.hm-sec { margin: var(--s2) 0 calc(-1 * var(--s1)); font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.hm-row.stuck { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
.hm-card.link { cursor: pointer; }
.hm-card.link:hover { border-color: var(--line-strong); }
.hm-load { display: grid; gap: 6px; margin-top: var(--s2); }
.hm-load > div { display: grid; grid-template-columns: 64px minmax(0, 1fr) 40px; gap: var(--s2); align-items: center; font-size: 12.5px; color: var(--muted); }
.hm-load i { height: 8px; border-radius: 4px; background: var(--ink); opacity: 0.75; min-width: 2px; }
.hm-load b { text-align: right; color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.hm-est { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: var(--s2); padding: 8px 10px; border: 1px dashed var(--line-strong); border-radius: 8px; color: var(--muted); font-size: 12.5px; cursor: help; }
.hm-est .tag { padding: 1px 6px; border-radius: 4px; background: var(--soft); color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.01em; }
.hm-est b { color: var(--ink); font-weight: 500; }
.hm-eff { display: grid; gap: 6px; padding: 6px 0; }
.hm-eff > div { display: flex; justify-content: space-between; font-size: 13.5px; }
.hm-eff b { font-weight: 500; font-variant-numeric: tabular-nums; }
.hm-eff > i { display: block; height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.hm-eff > i > i { display: block; height: 100%; border-radius: 4px; background: var(--muted); }
.hm-eff-n { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); margin-top: var(--s2); padding-top: var(--s3); border-top: 1px solid var(--line); }
.hm-eff-n div { display: grid; gap: 2px; }
.hm-eff-n b { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.hm-eff-n span { color: var(--muted); font-size: 12.5px; }
/* Settings: the interview process */
.set-proc { display: grid; gap: 2px; padding: var(--s2); margin-bottom: var(--s6); }
.proc-r { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--s2); align-items: center; }
.proc-n { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: var(--soft); color: var(--muted); font-size: 12px; }
.proc-in { height: 36px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; font: inherit; font-size: 14px; color: var(--ink); }
.proc-in:hover { border-color: var(--line); }
.proc-in:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 45%, var(--line-strong)); background: var(--raised); }

/* Compare styles: the same Overview twice, scaled to sit side by side */
.cmp { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); padding: var(--s4) var(--s6) var(--s6); overflow: auto; }
.cmp-col { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: var(--s2); min-width: 0; }
.cmp-h { display: flex; align-items: center; justify-content: space-between; }
.cmp-h b { font-size: 14px; font-weight: 600; }
.cmp-frame { border: 1px solid var(--line-strong); border-radius: 12px; overflow: auto; background: var(--paper); max-height: calc(100vh - 160px); }
.cmp-inner { width: 1180px; zoom: 0.52; pointer-events: none; }
.cmp-inner .bar, .cmp-inner .hm-nav { pointer-events: none; }
.cmp-inner .scroll { overflow: visible; }

/* The previous palette, with refined shading. Applies to the whole app (html.pal-prev) or one compare column (.pal-prev). */
.pal-prev .av:not(.cand), .pal-prev .team-key, .pal-prev .tdot, .pal-prev .label i, .pal-prev .handle, .pal-prev .st-ico, .pal-prev .doing, .pal-prev .readpill, .pal-prev .stackav { filter: none; }
.pal-prev .hm { background: linear-gradient(180deg, #f6f7fb 0, var(--paper) 420px); }
html.pal-prev .hm { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 5%, var(--paper)) 0, var(--paper) 420px); }
.pal-prev .hm-card, .pal-prev .hm-box { border-color: color-mix(in srgb, var(--accent) 10%, var(--line)); box-shadow: 0 1px 2px rgba(30, 34, 70, 0.04), 0 6px 16px -8px rgba(30, 34, 70, 0.12); }
.pal-prev .hm-hist i { background: color-mix(in srgb, var(--accent) 22%, var(--paper)); }
.pal-prev .hm-hist > span:last-child i, .pal-prev .hm-hist > span:hover i { background: var(--accent); }
.pal-prev .hm-hist i.over { background: var(--red); }
.pal-prev .s0 { background: color-mix(in srgb, var(--accent) 22%, var(--paper)); }
.pal-prev .s1 { background: color-mix(in srgb, var(--accent) 55%, var(--paper)); }
.pal-prev .s2 { background: var(--accent); }
.pal-prev .hm-load i, .pal-prev .hm-iv-b i, .pal-prev .hm-eff > i > i { background: var(--accent); opacity: 1; }
.pal-prev .hm-ic { background: var(--blue-soft); color: var(--blue); }
.pal-prev .hm-bn.k-sched .hm-ic { background: var(--amber-soft); color: var(--amber); }
.pal-prev .hm-bn.k-cards .hm-ic { background: var(--accent-soft); color: var(--accent); }
.pal-prev .hm-bn.k-decide .hm-ic { background: var(--ok-soft); color: var(--ok); }
.pal-prev .hm-bn.over .hm-ic { background: var(--red-soft); color: var(--red); }
.pal-prev .hm-sec { color: var(--ink); }
.pal-prev .hm-est { border-color: color-mix(in srgb, var(--accent) 40%, var(--line-strong)); background: color-mix(in srgb, var(--accent) 4%, var(--raised)); }
.pal-prev .hm-est .tag { background: var(--accent-soft); color: var(--accent); }
.hm-card { display: flex; flex-direction: column; gap: var(--s2); }
.hm-card .hm-f { margin-top: auto; }
.hm-card .hm-hist { flex: none; }

/* v63: the sidebar says "something new" with a faint red hue, shaped like hover, not a number or a dot */
.sb-item.new { background: color-mix(in srgb, var(--red) 8%, transparent); }
.sb-item.new:hover { background: color-mix(in srgb, var(--red) 12%, transparent); }

/* v63 Applicant Tickets: no page header; the list and the application run full height. The PDF keeps only zoom and download, floating on the page. */
.tk-nohead { height: 100%; }
.tk-nohead .mlist { padding-top: var(--s2); }
.tk-nohead .tk-top { padding-top: var(--s4); }
.dv { position: relative; }
.dv-bar.dv-float { position: absolute; top: var(--s3); right: var(--s4); z-index: 2; height: 36px; padding: 0 4px; gap: 2px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--raised); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
.dv-float .dv-z { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; }
.dv-float .dv-sep { width: 1px; height: 18px; margin: 0 4px; background: var(--line); }

/* v64 Team setup: onboarding and the people & teams portal, after the reference: a centred column, a stepper, a framed card, a checklist beside it */
.su-page { background: var(--paper); }
.su { display: grid; grid-template-columns: minmax(0, 760px) 300px; gap: var(--s6); justify-content: center; padding: 56px var(--s6) var(--s6); }
.su-step { color: var(--muted); font-size: 13.5px; }
.su-main h1 { margin: var(--s2) 0 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
.su-sub { margin: var(--s2) 0 0; color: var(--muted); font-size: 15px; }
.su-steps { display: flex; align-items: center; gap: var(--s3); margin: var(--s6) 0; }
.su-steps > i { flex: 1; height: 1px; background: var(--line-strong); }
.su-steps a { display: inline-flex; align-items: center; gap: var(--s2); color: var(--muted); font-size: 14px; white-space: nowrap; }
.su-steps a span { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line-strong); font-size: 12px; background: var(--raised); }
.su-steps a.on { color: var(--ink); font-weight: 500; }
.su-steps a.on span { border-color: var(--ink); color: var(--ink); }
.su-steps a.done span { background: var(--soft); border-color: transparent; color: var(--ink); }
.su-steps a .ico { width: 12px; height: 12px; }
.su-frame { border-radius: 16px; background: var(--soft); padding: 4px; }
.su-card { background: var(--raised); border: 1px solid var(--line); border-radius: 13px; padding: var(--s6); display: grid; gap: var(--s5); }
.su-ch { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s4); }
.su-ch h3 { margin: 0; font-size: 18px; font-weight: 600; }
.su-ch p { margin: var(--s2) 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 520px; }
.su-ch .btn svg { width: 14px; height: 14px; }
.su-foot { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s3) var(--s2) var(--s5); }
.su-skip { color: var(--muted); font-size: 14px; }
.su-skip:hover { color: var(--ink); }
.btn.primary.dark { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.su-foot .btn { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: 10px; font-size: 14px; }
.su-foot .btn .ico { width: 13px; height: 13px; }
.su-list { display: grid; }
.su-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto 44px; gap: var(--s3); align-items: center; padding: var(--s3) 0; border-top: 1px solid var(--line); }
.su-row:first-child { border-top: 0; }
.su-row > .av { width: 36px; height: 36px; font-size: 12px; }
.su-who { display: grid; min-width: 0; }
.su-who b { font-size: 14.5px; font-weight: 500; }
.su-who > span { color: var(--muted); font-size: 13px; }
.su-multi { font-style: normal; color: var(--accent); font-size: 12px; font-weight: 500; }
.su-bot { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.su-bot .bot .av { width: 20px; height: 20px; font-size: 7.5px; }
.su-bot.invited { color: var(--amber); }
.su-bot .ico { width: 13px; height: 13px; }
.su-tog { width: 40px; height: 24px; border-radius: 12px; background: var(--soft-strong); position: relative; transition: background 0.15s; }
.su-tog i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: transform 0.15s; }
.su-tog.on { background: var(--ink); }
.su-tog.on i { transform: translateX(16px); }
.su-add { display: grid; grid-template-columns: 1.2fr 1.2fr 1fr auto; gap: var(--s2); padding-top: var(--s4); border-top: 1px solid var(--line); }
.su-add input { height: 36px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--paper); font: inherit; font-size: 13.5px; color: var(--ink); min-width: 0; }
.su-add input:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 45%, var(--line-strong)); }
/* teams matrix */
.su-mx { display: grid; }
.su-mx-h, .su-mx-r { display: grid; grid-template-columns: minmax(200px, 1.6fr) repeat(var(--cols), minmax(90px, 1fr)); align-items: center; gap: var(--s2); }
.su-mx-h { padding-bottom: var(--s2); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.su-mx-h span { display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.su-mx-h em { font-style: normal; color: var(--faint); }
.su-mx-r { padding: var(--s2) 0; border-bottom: 1px solid var(--line); }
.su-mx-r .su-who { grid-template-columns: 28px auto auto; gap: 10px; align-items: center; justify-content: start; }
.su-mx-r .su-who .av { width: 28px; height: 28px; font-size: 10px; }
.su-cell { display: flex; align-items: center; justify-content: center; gap: 6px; }
.su-lead { height: 20px; padding: 0 6px; border-radius: 5px; color: var(--faint); font-size: 11px; }
.su-lead:hover { background: var(--soft); color: var(--ink); }
.su-lead.on { background: var(--soft); color: var(--ink); font-weight: 600; }
/* skills */
.su-sk { display: grid; gap: var(--s3); padding: var(--s4) 0; border-top: 1px solid var(--line); }
.su-sk:first-child { border-top: 0; padding-top: 0; }
.su-sk-h { display: flex; align-items: center; gap: var(--s3); }
.su-sk-h .av { width: 32px; height: 32px; font-size: 11px; }
.su-sk-b { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: var(--s2) var(--s3); align-items: start; padding-left: 44px; }
.su-sk-l { color: var(--faint); font-size: 12.5px; padding-top: 5px; }
.su-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.su-tag { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 10px; border-radius: 13px; background: var(--soft); font-size: 12.5px; color: var(--ink); }
.su-tag button { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; color: var(--faint); }
.su-tag button:hover { background: var(--soft-strong); color: var(--ink); }
.su-tag button .ico { width: 10px; height: 10px; }
.su-tag.add { padding: 0 10px; gap: 4px; border: 1px dashed var(--line-strong); background: transparent; color: var(--muted); }
.su-tag.add .ico { width: 11px; height: 11px; }
.su-iv { height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line); color: var(--faint); font-size: 12.5px; }
.su-iv:hover { border-color: var(--line-strong); color: var(--muted); }
.su-iv.on { border-color: var(--line-strong); color: var(--ink); background: var(--raised); }
.su-iv.prio { border-color: var(--ink); background: var(--ink); color: var(--paper); }
/* review */
.su-sum { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 12px; }
.su-sum > div { display: grid; gap: 2px; padding: var(--s3) var(--s4); border-left: 1px solid var(--line); }
.su-sum > div:first-child { border-left: 0; }
.su-sum b { font-size: 22px; font-weight: 600; }
.su-sum span { color: var(--muted); font-size: 12.5px; }
.su-cov { display: grid; }
.su-cov-r { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--s3); align-items: center; min-height: 44px; border-top: 1px solid var(--line); }
.su-cov-t { font-size: 14px; }
.su-cov-r.gap .su-cov-t { color: var(--red); }
.su-cov-p { display: flex; gap: 6px; flex-wrap: wrap; }
.su-cov-a { position: relative; }
.su-cov-a .av { width: 28px; height: 28px; font-size: 10px; }
.su-cov-a.prio .av { box-shadow: 0 0 0 2px var(--raised), 0 0 0 3.5px var(--ink); }
.su-cov-a i { position: absolute; right: -4px; bottom: -4px; font-style: normal; font-size: 10px; background: var(--raised); border-radius: 50%; width: 14px; height: 14px; display: grid; place-items: center; }
.su-gap { color: var(--red); font-size: 13px; }
.su-note { display: flex; gap: 8px; align-items: center; margin: 0; color: var(--muted); font-size: 13px; }
.su-note .ico { width: 14px; height: 14px; color: var(--red); }
/* checklist */
.su-side { padding-top: 104px; display: grid; gap: var(--s4); align-content: start; }
.su-check { border-radius: 14px; background: var(--soft); padding: var(--s4); display: grid; gap: 2px; }
.su-check-h { display: flex; justify-content: space-between; padding: 0 var(--s2); font-size: 14px; }
.su-check-h b { font-weight: 600; }
.su-check-h span { color: var(--muted); font-variant-numeric: tabular-nums; }
.su-prog { display: block; height: 4px; margin: var(--s3) var(--s2); border-radius: 2px; background: var(--soft-strong); overflow: hidden; }
.su-prog i { display: block; height: 100%; background: var(--ink); border-radius: 2px; }
.su-ci { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: var(--s3); padding: var(--s3) var(--s2); border-radius: 10px; }
.su-ci.on { background: var(--raised); box-shadow: 0 0 0 1px var(--line); }
.su-ci b { display: block; font-size: 14px; font-weight: 500; }
.su-ci span span { color: var(--muted); font-size: 12.5px; }
.su-ck { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; margin-top: 1px; }
.su-ck.done { background: var(--ink); border-color: var(--ink); color: #fff; }
