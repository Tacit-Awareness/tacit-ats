/* Layout: Linear, closely. Sidebar on a neutral frame, one rounded panel,
   pill tabs, grouped rows with no dividers, a grey band per group. Neutral
   greys only; indigo for selection and primary actions, red for overdue,
   orange for urgent, and the status colours (grey, yellow, orange, indigo). */
:root {
  --frame: #f4f4f5;
  --surface: #fcfcfc;
  --paper: #ffffff;
  --raised: #ffffff;
  --ink: #1f2023;
  --muted: #5f6269;
  --faint: #8f9198;
  --line: #e9e9eb;
  --line-strong: #dcdcdf;
  --soft: #f1f1f2;
  --soft-strong: #e8e8ea;
  --band: #f3f3f4;
  --hover: rgba(0, 0, 0, 0.035);
  --sel: #eef0fb;
  --accent: #5e6ad2;
  --accent-ink: #ffffff;
  --accent-soft: #eceefb;
  --red: #e5484d;
  --red-soft: #fdecec;
  --orange: #f2784b;
  --st-1: #a3a5ab;
  --st-2: #a3a5ab;
  --st-3: #e8b931;
  --st-4: #f2994a;
  --st-5: #5e6ad2;
  --done: #5e6ad2;
  --closed: #a3a5ab;
  --tone-1: #d6d7da;
  --tone-2: #a3a5ab;
  --tone-3: #f0cc5c;
  --tone-4: #f2994a;
  --tone-5: #5e6ad2;
  --blue: #2f6fe0;
  --blue-soft: #eaf1fd;
  --ok: #2c8a4f;
  --ok-soft: #e7f5ec;
  --amber: #a8650a;
  --amber-soft: #fcf1dc;
  --wire: #a9c3f2;
  --canvas: #fafafa;
  --agent-bg: #ececee;
  --agent-ink: #3a3c42;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  --pop-shadow: 0 12px 32px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.06);
  --scrim: rgba(20, 20, 24, 0.24);
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}

}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--frame);
  color: var(--ink);
  font: 400 13px/1.45 var(--sans);
  font-feature-settings: "cv01", "ss03";
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 1px; }
svg { display: block; }
.mono, .num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.red { color: var(--red); }
.green { color: var(--ink); }
.grow { flex: 1; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.mark {

  flex-shrink: 0;
  background: var(--ink);
  -webkit-mask: url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj4KPCEtLSBTVkcgY3JlYXRlZCB3aXRoIEFycm93LCBieSBRdWl2ZXJBSSAoaHR0cHM6Ly9xdWl2ZXIuYWkpIC0tPgogIDxwYXRoIGQ9Ik0gNDAgMTQgSCA2NiBWIDQwIiBmaWxsPSJub25lIiBzdHJva2U9IiMwMDAwMDAiIHN0cm9rZS13aWR0aD0iMTEiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgaWQ9InNoYXBlX3RvcF9yaWdodCIvPjxwYXRoIGQ9Ik0gNDAgNjYgSCAxNCBWIDQwIiBmaWxsPSJub25lIiBzdHJva2U9IiMwMDAwMDAiIHN0cm9rZS13aWR0aD0iMTEiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgaWQ9InNoYXBlX2JvdHRvbV9sZWZ0Ii8+PC9zdmc+) center / contain no-repeat;

/* ---------- frame ---------- */
.app { display: flex; height: 100%; }
.side {
  width: 236px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 10px 8px 10px 12px;
  overflow-y: auto;
  scrollbar-width: none;
}
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 8px 8px 8px 0; position: relative; }
.panel {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
  position: relative;
}
.phonebar { display: none; }
.scrim { display: none; }

/* ---------- sidebar ---------- */
.ws { display: flex; align-items: center; gap: 2px; height: 32px; }
.ws-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 1;
  height: 30px;
  padding: 0 6px;
  border-radius: 6px;
  font-weight: 500;
  font-size: 13.5px;
}
.ws-btn:hover { background: var(--hover); }
.ws-logo {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 5px;
  background: linear-gradient(135deg, #8b93e6, #5e6ad2);
  color: #fff;
  font-size: 10.5px;
  font-weight: 600;
  flex-shrink: 0;
}
.icon-btn {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  color: var(--muted);
  flex-shrink: 0;
  position: relative;
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn svg, .nav svg, .ico { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.round { border-radius: 50%; border: 1px solid var(--line-strong); background: var(--paper); box-shadow: var(--shadow); color: var(--ink); }
.icon-btn.boxed { border: 1px solid var(--line); border-radius: 50%; width: 30px; height: 30px; color: var(--muted); }
.icon-btn.boxed:hover { border-color: var(--line-strong); }
.icon-btn.boxed.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--accent-soft); }

.nav { display: grid; gap: 1px; }
.nav-head {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 8px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--faint);
  border-radius: 6px;
  width: 100%;
  text-align: left;
}
.nav-head:hover { color: var(--muted); }
.tri, .nav svg.tri { width: 8px; height: 8px; fill: currentColor; stroke: none; transition: transform 0.15s; flex-shrink: 0; }
.collapsed .tri { transform: rotate(-90deg); }
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 28px;
  padding: 0 8px;
  border-radius: 6px;
  color: var(--ink);
  font-weight: 450;
  white-space: nowrap;
  width: 100%;
  text-align: left;
}
.nav-item svg { color: var(--muted); }
.nav-item:hover { background: var(--hover); }
.nav-item.on { background: var(--soft-strong); font-weight: 500; }
.nav-item .count { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; font-weight: 400; }
.nav-item .tri { color: var(--faint); margin-left: -2px; }
.nav-sub { padding-left: 34px; }
.job-key {
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 5px;
  font-size: 9.5px;
  font-weight: 600;
  color: #fff;
  flex-shrink: 0;
}
.chev { width: 10px; height: 10px; transition: transform 0.15s; fill: none; stroke: currentColor; stroke-width: 1.6; }
.collapsed .chev { transform: rotate(-90deg); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

.me { margin-top: auto; display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; }
.me .who { display: grid; min-width: 0; line-height: 1.25; }
.me .who b { font-weight: 500; font-size: 12.5px; }
.me .who span { font-size: 11.5px; color: var(--faint); }

/* ---------- avatars, agent tiles ---------- */
.av {
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  font-size: 8.5px;
  font-weight: 600;
  color: #fff;
}
.av.lg { width: 24px; height: 24px; font-size: 10px; }
.av.xl { width: 36px; height: 36px; font-size: 13px; }
.av.none { background: transparent; border: 1px dashed var(--faint); color: var(--faint); }
.av.none svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.4; }
.agent {
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border-radius: 5px;
  background: var(--agent-bg);
  color: var(--agent-ink);
  position: relative;
}
.agent svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.agent.lg { width: 24px; height: 24px; border-radius: 6px; }
.agent.lg svg { width: 14px; height: 14px; }
.agent.xl { width: 36px; height: 36px; border-radius: 9px; }
.agent.xl svg { width: 18px; height: 18px; }
.agent.working::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 7px;
  border: 1.5px solid transparent;
  border-top-color: var(--accent);
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.tacit-tile { display: inline-grid; place-items: center; width: 16px; height: 16px; flex-shrink: 0; }
.tacit-tile .mark { width: 10px; height: 10px; background: var(--ink); }

/* ---------- panel header ---------- */
.bar {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 48px;
  padding: 0 12px 0 16px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13.5px; font-weight: 500; }
.crumbs a { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs a:hover { color: var(--muted); }
.crumbs .sep { color: var(--faint); font-weight: 400; }
.crumbs .sep svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.crumbs b { font-weight: 500; white-space: nowrap; }
.crumbs .ico { color: var(--muted); }
.bar .spacer { flex: 1; }
.subbar {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 50px;
  padding: 10px 12px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.filterbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
.scroll { flex: 1; min-height: 0; overflow: auto; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  border-radius: 15px;
  color: var(--ink);
  border: 1px solid var(--line);
  white-space: nowrap;
  font-weight: 450;
}
.tab:hover { background: var(--hover); }
.tab.on { background: var(--soft-strong); border-color: transparent; font-weight: 500; }
.tab .n { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.seg {
  display: inline-flex;
  padding: 2px;
  border-radius: 8px;
  background: var(--soft);
  border: 1px solid var(--line);
}
.seg button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 9px;
  border-radius: 6px;
  color: var(--muted);
  font-size: 12.5px;
}
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); font-weight: 500; }
.seg svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.3; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 28px;
  padding: 0 11px;
  border-radius: 6px;
  font-weight: 500;
  white-space: nowrap;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  box-shadow: var(--shadow);
  transition: background 0.12s, border-color 0.12s;
}
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--ink); }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12.5px; }
.btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.btn .kbd { margin-left: 2px; }
.btn.primary .kbd { background: rgba(255, 255, 255, 0.18); color: inherit; border-color: transparent; }
.kbd {
  display: inline-grid;
  place-items: center;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--soft);
  color: var(--faint);
  font-size: 10.5px;
  font-weight: 500;
  line-height: 1;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 9px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  font-size: 12.5px;
  white-space: nowrap;
}
.chip:hover { border-color: var(--line-strong); }
.chip.on { background: var(--soft); }
.chip .x { color: var(--faint); margin-left: 2px; }
.chip svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.4; }
.chip .k { color: var(--faint); }

.label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 22px;
  padding: 0 8px;
  border-radius: 11px;
  border: 1px solid var(--line);
  color: var(--ink);
  font-size: 12px;
  white-space: nowrap;
  background: var(--paper);
}
.label i { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.label .tacit-tile { width: 12px; height: 12px; }
.label .tacit-tile .mark { width: 8px; height: 8px; }
.label.red { color: var(--red); }
.label.green { color: var(--muted); }
.label .ico { width: 12px; height: 12px; }

.st { width: 14px; height: 14px; flex-shrink: 0; }
.pr { width: 14px; height: 14px; flex-shrink: 0; color: var(--muted); }

/* ---------- ticket list ---------- */
.list { padding: 0 0 80px; }
.group-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  margin: 0 8px;
  padding: 0 8px 0 10px;
  background: var(--band);
  border-radius: 6px;
  font-weight: 500;
}
.list .group-head ~ .group-head { margin-top: 6px; }
.group-head .n { color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
.group-head .add { margin-left: auto; }
.group-head button.toggle { display: flex; align-items: center; gap: 9px; }
.group-head .tri { color: var(--faint); }
.trow {
  display: grid;
  grid-template-columns: 16px 16px 58px 14px minmax(0, 1fr) auto auto 18px 48px;
  align-items: center;
  column-gap: 12px;
  height: 38px;
  padding: 0 20px 0 18px;
  cursor: default;
  position: relative;
}
.trow:hover { background: var(--hover); }
.trow.focus { background: var(--soft); }
.trow.picked { background: var(--sel); }
.trow .check {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  border: 1px solid var(--line-strong);
  display: grid;
  place-items: center;
  opacity: 0;
  background: var(--paper);
}
.trow:hover .check, .trow.picked .check, .picking .trow .check { opacity: 1; }
.trow.picked .check { background: var(--accent); border-color: var(--accent); }
.trow.picked .check::after { content: ""; width: 7px; height: 4px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
.trow .tid { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
.trow .title { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.trow .title b { font-weight: 500; white-space: nowrap; }
.trow .title .hl { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tags { display: flex; gap: 5px; justify-content: flex-end; min-width: 0; overflow: hidden; }
.trow .when { color: var(--faint); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.trow .prop-btn { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; margin: -4px; }
.trow .prop-btn:hover { background: var(--soft-strong); }
.trow .open { position: absolute; inset: 0; z-index: 0; }
.trow > *:not(.open) { position: relative; z-index: 1; }
.trow > span { pointer-events: none; }
.trow > span .label, .trow > span .due, .trow > span .working { pointer-events: auto; }
.progress {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 8px 0 6px;
  border-radius: 11px;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.progress svg { width: 12px; height: 12px; }
.due {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 9px 0 7px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-size: 12.5px;
  color: var(--ink);
  white-space: nowrap;
}
.due svg { width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-linecap: round; flex-shrink: 0; }
.due.late svg, .due.today svg { stroke: var(--red); }
.working {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 9px 0 4px;
  border-radius: 7px;
  font-size: 12.5px;
  white-space: nowrap;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  max-width: 300px;
}
.working .agent { width: 16px; height: 16px; border-radius: 4px; }
.working .agent svg { width: 10px; height: 10px; }
.working .agent.working::after { inset: -2px; border-radius: 5px; }
.working .shimmer {
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: linear-gradient(90deg, var(--faint) 0%, var(--ink) 40%, var(--faint) 80%) 0 0 / 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shimmer 2.2s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.working.ask b { font-weight: 500; }
.working.ask .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.bulk {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px 4px 4px 12px;
  border-radius: 10px;
  background: var(--raised);
  border: 1px solid var(--line-strong);
  box-shadow: var(--pop-shadow);
  white-space: nowrap;
  animation: rise 0.2s ease-out;
}
.bulk .n { font-weight: 500; margin-right: 6px; }
@keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } }

/* ---------- board ---------- */
.board { display: flex; gap: 8px; padding: 0 12px 24px; min-height: 100%; align-items: flex-start; width: max-content; }
.col { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; border-radius: 8px; padding: 4px; transition: background 0.15s; min-height: 300px; background: var(--band); }
.col.over { background: var(--accent-soft); }
.col-head { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px; font-weight: 500; }
.col-head .n { color: var(--faint); font-weight: 400; }
.col-head .add { margin-left: auto; }
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 11px 11px;
  box-shadow: var(--shadow);
  display: grid;
  gap: 7px;
  cursor: grab;
}
.card:hover { border-color: var(--line-strong); }
.card.dragging { opacity: 0.4; }
.card .top { display: flex; align-items: center; gap: 8px; }
.card .top .tid { color: var(--faint); font-size: 12.5px; }
.card .name { font-weight: 500; line-height: 1.3; }
.card .hl { color: var(--faint); font-size: 12.5px; margin-top: -4px; }
.card .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.card .working, .card .due { max-width: 100%; }
.col.closed .card { opacity: 0.75; }

/* ---------- ticket detail ---------- */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 280px; min-height: 100%; }
.detail .body { padding: 32px 48px 80px; max-width: 840px; width: 100%; justify-self: center; }
.detail .props { border-left: 1px solid var(--line); padding: 14px 12px 40px; display: grid; align-content: start; gap: 16px; }
.t-head { display: flex; align-items: center; gap: 12px; }
.t-head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.012em; line-height: 1.25; text-wrap: balance; }
.t-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.block { margin-top: 32px; }
.block-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 500; }
.block-head .n { color: var(--faint); font-weight: 400; }
.block-head .aside { margin-left: auto; font-weight: 400; }

.fit { display: grid; gap: 10px; }
.fit-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--faint); }
.fit-head b { color: var(--ink); font-weight: 500; }
.fit ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; line-height: 1.55; }
.fit li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; }
.fit li svg { width: 12px; height: 12px; margin-top: 5px; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke: var(--faint); }
.fit li.plus svg { stroke: var(--muted); }

.plan { border-top: 1px solid var(--line); }
.plan-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; min-height: 38px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.plan-row:hover { background: var(--hover); }
.plan-row .what { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.plan-row .what b { font-weight: 500; white-space: nowrap; }
.plan-row .what span { color: var(--faint); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-row .avs { display: flex; }
.plan-row .avs > * + * { margin-left: -4px; box-shadow: 0 0 0 2px var(--surface); }

.props .group { display: grid; gap: 1px; }
.props .group-title { font-size: 12px; color: var(--faint); font-weight: 500; padding: 0 8px 4px; }
.prop {
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr);
  align-items: center;
  min-height: 30px;
  gap: 8px;
  padding: 0 8px;
  border-radius: 6px;
}
.prop .k { color: var(--faint); font-size: 12.5px; }
.prop .v { display: flex; align-items: center; gap: 8px; min-width: 0; }
button.prop { text-align: left; width: 100%; }
button.prop:hover { background: var(--hover); }
.prop .v .trunc { flex: 1; }

.feed { display: grid; position: relative; }
.ev { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 6px 0; position: relative; font-size: 12.5px; color: var(--muted); }
.ev::before { content: ""; position: absolute; left: 8.5px; top: 26px; bottom: -6px; width: 1px; background: var(--line); }
.ev:last-child::before { display: none; }
.ev .who { color: var(--ink); font-weight: 500; }
.ev .t { color: var(--faint); margin-left: 6px; }
.ev .ico-dot { width: 18px; height: 18px; display: grid; place-items: center; }
.ev .ico-dot i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
.ev .line { padding-top: 1px; }
.ev .line > .st { display: inline-block; vertical-align: -3px; margin: 0 1px; }
.comment {
  margin-top: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  padding: 10px 12px;
  color: var(--ink);
  font-size: 13.5px;
  line-height: 1.55;
}
.comment .meta { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--faint); margin-bottom: 4px; }
.comment .meta b { color: var(--ink); font-weight: 500; }
.rating { display: inline-flex; gap: 2px; vertical-align: -1px; }
.rating i { width: 7px; height: 7px; border-radius: 2px; background: var(--line-strong); }
.rating i.on { background: var(--muted); }

.run {
  margin-top: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  overflow: hidden;
}
.run.active { border-color: var(--line-strong); box-shadow: var(--shadow); }
.run-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: var(--ink); width: 100%; text-align: left; }
.run-head .grow b { font-weight: 500; }
.run-head .grow span { color: var(--faint); }
.steps { padding: 0 12px 10px 46px; display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
.step { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: start; }
.step.new { animation: fadein 0.3s ease; }
.step svg { width: 13px; height: 13px; margin-top: 2px; fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.step .spin { width: 11px; height: 11px; margin: 3px 1px 0; border-radius: 50%; border: 1.5px solid var(--line-strong); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } }
.draft { margin: 0 12px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.draft-meta { display: grid; gap: 3px; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.draft-meta span { color: var(--faint); display: inline-block; width: 56px; }
.draft-body { padding: 10px 12px; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; outline: none; }
.draft-body[contenteditable="true"] { background: var(--paper); box-shadow: inset 0 0 0 1px var(--accent); border-radius: 0 0 8px 8px; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
.slot { height: 24px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--line); display: inline-flex; align-items: center; font-size: 12.5px; background: var(--paper); }
.approve { display: flex; align-items: center; gap: 6px; padding: 8px 10px 8px 12px; border-top: 1px solid var(--line); }
.approve .hint { color: var(--faint); font-size: 12.5px; margin-right: auto; }

.composer {
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  transition: border-color 0.12s;
}
.composer:focus-within { border-color: var(--line-strong); box-shadow: var(--shadow); }
.composer textarea { width: 100%; border: 0; outline: none; resize: none; background: transparent; padding: 11px 12px 4px; font-size: 13.5px; line-height: 1.5; min-height: 56px; display: block; }
.composer textarea::placeholder { color: var(--faint); }
.composer .tools { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px 10px; }
.composer .tools .hint { margin-right: auto; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.mention { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px 0 3px; border-radius: 6px; font-size: 12px; color: var(--muted); }
.mention:hover { color: var(--ink); background: var(--hover); }
.mention .agent { width: 16px; height: 16px; border-radius: 4px; }
.mention .agent svg { width: 10px; height: 10px; }

/* ---------- pages ---------- */
.page { padding: 28px 32px 80px; max-width: 1120px; margin: 0 auto; width: 100%; display: grid; gap: 20px; align-content: start; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.012em; }
.page-head p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  overflow: hidden;
}
.stat { display: grid; gap: 6px; padding: 12px 14px; box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); text-align: left; }
button.stat:hover, a.stat:hover { background: var(--hover); }
.stat span { color: var(--muted); font-size: 12.5px; }
.stat b { font-weight: 600; font-size: 22px; line-height: 1.1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.stat small { color: var(--faint); font-size: 12px; }
.cardbox { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); overflow: hidden; }
.cardbox-head { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-bottom: 1px solid var(--line); font-weight: 500; }
.cardbox-head .n { color: var(--faint); font-weight: 400; }
.cardbox-head .aside { margin-left: auto; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.cardbox-head .aside:hover { color: var(--ink); }
.split { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; align-content: start; }
.lrow { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 7px 14px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.lrow:last-child { border-bottom: 0; }
a.lrow:hover, button.lrow:hover { background: var(--hover); }
.lrow .grow b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .grow span { color: var(--faint); font-size: 12.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .time { width: 64px; flex-shrink: 0; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.lrow .time.now { color: var(--accent); font-weight: 500; }
.empty { padding: 28px 16px; color: var(--faint); text-align: center; }

.pipe { display: grid; gap: 12px; padding: 14px; }
.pipe-row { display: grid; grid-template-columns: 210px minmax(0, 1fr) 32px; gap: 14px; align-items: center; }
.pipe-row .nm { display: flex; align-items: center; gap: 9px; min-width: 0; font-weight: 500; }
.pipe-row .nm:hover { color: var(--muted); }
.bars { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.bars i { display: block; height: 100%; }
.pipe-row .tot { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 0 14px 14px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; }

.arow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px; border-bottom: 1px solid var(--line); }
.arow:last-child { border-bottom: 0; }
.arow .nm { font-weight: 500; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.arow .desc { color: var(--muted); margin-top: 2px; }
.arow .on-now { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.arow .ctrl { display: grid; gap: 6px; justify-items: end; }
.arow .ctrl small { color: var(--faint); font-size: 12px; }
.tlink { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); font-size: 12px; color: var(--ink); }
.tlink:hover { background: var(--hover); }
.tlink .mono { color: var(--faint); }
.logrow { display: grid; grid-template-columns: 44px 18px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.logrow:last-child { border-bottom: 0; }
.logrow .t { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.logrow .what { color: var(--muted); }
.logrow .what b { color: var(--ink); font-weight: 500; }
.logrow a.tid { color: var(--faint); }
.logrow a.tid:hover { color: var(--ink); }

.inbox { display: grid; grid-template-columns: 360px minmax(0, 1fr); min-height: 0; flex: 1; }
.inbox-list { border-right: 1px solid var(--line); overflow-y: auto; padding: 6px 0; }
.irow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; padding: 9px 10px 9px 14px; margin: 0 6px; border-radius: 6px; text-align: left; width: calc(100% - 12px); position: relative; }
.irow:hover { background: var(--hover); }
.irow.on { background: var(--soft-strong); }
.irow .grow b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .grow span { color: var(--muted); font-size: 12.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .grow .ref { color: var(--faint); font-size: 12px; margin-top: 1px; }
.irow .t { color: var(--faint); font-size: 12px; white-space: nowrap; }
.irow.read .grow b { font-weight: 400; color: var(--muted); }
.irow .unread { position: absolute; left: 4px; top: 17px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.inbox-view { overflow-y: auto; }
.inbox-view .inner { max-width: 720px; margin: 0 auto; padding: 28px 32px 80px; display: grid; gap: 16px; }
.inbox-view h2 { margin: 0; font-size: 18px; letter-spacing: -0.01em; font-weight: 600; }
.done-state { display: grid; place-items: center; height: 100%; color: var(--faint); text-align: center; gap: 10px; padding: 40px; }
.done-state .big { font-size: 15px; color: var(--ink); font-weight: 500; }

.sc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.sc-row:last-child { border-bottom: 0; }
.sc-row span { color: var(--faint); font-size: 12.5px; display: block; }
.dots5 { display: inline-flex; gap: 3px; }
.dots5 button { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line-strong); font-size: 11.5px; color: var(--muted); }
.dots5 button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ---------- agent tiles: letters, solid team colours ---------- */
.agent.solid { color: #fff; }
.agent .ltr { font-size: 10px; font-weight: 600; line-height: 1; }
.agent.lg .ltr { font-size: 12px; }
.agent.xl .ltr { font-size: 16px; }
.agent .mark { width: 9px; height: 9px; background: #fff; }
.agent.lg .mark { width: 12px; height: 12px; }
.agent.xl .mark { width: 17px; height: 17px; }
.label .agent { width: 14px; height: 14px; border-radius: 4px; }
.label .agent .ltr { font-size: 8px; }
.label .agent svg { width: 9px; height: 9px; }
.label .tool { width: 13px; height: 13px; }

/* ---------- status pills (canvas) ---------- */
.spill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 9px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
  flex-shrink: 0;
}
.spill svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.spill .ring { width: 11px; height: 11px; border-radius: 50%; border: 1.6px solid color-mix(in srgb, currentColor 25%, transparent); border-top-color: currentColor; animation: spin 0.9s linear infinite; }
.spill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.spill.run { color: var(--blue); background: var(--blue-soft); }
.spill.wait { color: var(--amber); background: var(--amber-soft); }
.spill.done { color: var(--ok); background: var(--ok-soft); }
.spill.fail { color: var(--red); background: var(--red-soft); }
.spill.idle { color: var(--faint); background: var(--soft); }
button.spill { cursor: pointer; }
button.spill .chev { width: 10px; height: 10px; }

.tools { display: inline-flex; align-items: center; gap: 2px; padding: 2px 3px; margin-right: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); vertical-align: -5px; }
.tool { display: inline-grid; place-items: center; width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
.tool svg { width: 15px; height: 15px; }

/* ---------- orchestration canvas ---------- */
.canvas-wrap { background: var(--canvas); }
.canvas { position: relative; min-width: max-content; padding: 30px 28px 80px; }
.cv-head { display: flex; align-items: center; gap: 16px; padding: 0 56px 0 4px; margin-bottom: 26px; }
.cv-title { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 500; flex: 1; }
.star { width: 16px; height: 16px; fill: var(--blue); }
.cv-stats { display: flex; align-items: center; gap: 16px; font-size: 14px; }
.cv-stats .blue { color: var(--blue); }
.cv-stats .amber { color: var(--amber); }
.cv-stats b { font-weight: 500; font-size: 15px; }
.tier0 { display: flex; justify-content: center; }
.tier1 { display: grid; grid-template-columns: repeat(5, 214px); gap: 0 16px; justify-content: center; margin-top: 56px; align-items: start; }
.branch { display: grid; gap: 0; min-width: 0; }
.branch > .acard, .kids > .acard { min-width: 0; }
.kids { display: grid; gap: 12px; margin: 22px 0 0 28px; }
.wires { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.wires path { fill: none; stroke: var(--wire); stroke-width: 1.5; }
.wires circle { fill: var(--canvas); stroke: var(--wire); stroke-width: 1.5; }
.acard {
  position: relative;
  z-index: 1;
  display: grid;
  gap: 10px;
  padding: 12px 12px 11px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.12s, box-shadow 0.12s;
}
.acard:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.acard.sel { border-color: color-mix(in srgb, var(--blue) 45%, var(--line)); box-shadow: 0 0 0 3px var(--blue-soft); }
.acard.root { width: 260px; }
.ac-top { display: flex; align-items: flex-start; gap: 9px; }
.ac-top .grow { display: grid; line-height: 1.25; min-width: 0; }
.ac-top b { font-weight: 500; font-size: 14px; }
.ac-top .grow span { color: var(--faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac-task { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; }
.ac-err { margin: -4px 0 0; font-size: 12.5px; color: var(--red); }
.ac-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; min-height: 24px; }
.ac-foot b { color: var(--ink); font-weight: 500; }
.ac-foot > span:first-child { white-space: nowrap; }
.kid .spill { height: 22px; padding: 0 7px; font-size: 12px; gap: 5px; }
.kid .spill svg { width: 12px; height: 12px; }
.kid .spill .ring { width: 10px; height: 10px; }
.kids-n { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border-radius: 5px; color: var(--muted); font-size: 12.5px; }
.kids-n:hover { background: var(--hover); color: var(--ink); }
.kids-n.collapsed .chev { transform: rotate(-90deg); }
.more { justify-self: start; color: var(--muted); font-size: 12.5px; padding: 2px 6px; border-radius: 5px; }
.more:hover { background: var(--hover); color: var(--ink); }
.cv-tools { position: absolute; right: 12px; top: 12px; z-index: 5; display: grid; gap: 8px; justify-items: center; }
.cv-btn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: var(--muted); background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); }
.cv-btn:hover { color: var(--ink); }
.cv-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.cv-stack { display: grid; gap: 4px; padding: 3px; border-radius: 20px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); }
.cv-stack .cv-btn { border: 0; box-shadow: none; width: 30px; height: 30px; background: transparent; }
.cv-stack .cv-btn.on { background: var(--soft-strong); color: var(--ink); }

.drawer {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  z-index: 8;
  width: 320px;
  max-width: 100%;
  overflow-y: auto;
  background: var(--raised);
  border-left: 1px solid var(--line);
  box-shadow: var(--pop-shadow);
  padding: 14px 14px 40px;
  display: grid;
  align-content: start;
  gap: 18px;
}
@keyframes slidein { from { transform: translateX(12px); opacity: 0; } }
.dr-head { display: flex; align-items: center; gap: 11px; }
.dr-head .grow { display: grid; line-height: 1.3; }
.dr-head b { font-weight: 600; font-size: 15px; }
.dr-head span { color: var(--faint); font-size: 12.5px; }
.dr-sec { display: grid; gap: 6px; }
.dr-k { font-size: 12px; color: var(--faint); font-weight: 500; }
.dr-row { display: flex; align-items: center; gap: 9px; min-height: 32px; padding: 0 8px; margin: 0 -8px; border-radius: 6px; width: calc(100% + 16px); text-align: left; }
.dr-row:hover { background: var(--hover); }
.dr-skills { display: flex; flex-wrap: wrap; gap: 5px; }
.dr-skills .label .agent { width: 14px; height: 14px; border-radius: 4px; }
.dr-skills .label .agent svg { width: 9px; height: 9px; }
.dr-log { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; font-size: 12.5px; padding: 3px 0; }
.dr-log .grow { color: var(--ink); }

/* ---------- intake ---------- */
.sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.src { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); text-align: left; }
.src .grow { display: grid; line-height: 1.3; min-width: 0; }
.src b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src .grow span { color: var(--faint); font-size: 12.5px; }
.src .on { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
.src.add { color: var(--muted); border-style: dashed; }
.src.add:hover { color: var(--ink); background: var(--hover); }
.src.add b { font-weight: 500; }
.src .tool, .src > svg { width: 18px; height: 18px; }
.inrow {
  display: grid;
  grid-template-columns: 40px 18px minmax(0, 1.2fr) 14px minmax(0, 1fr) 84px minmax(150px, auto);
  align-items: center;
  gap: 12px;
  min-height: 44px;
  padding: 6px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.inrow:last-child { border-bottom: 0; }
.inrow .t { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.inrow .raw { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inrow .arr { width: 13px; height: 13px; fill: none; stroke: var(--faint); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.inrow .who { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inrow .to { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.inrow .res { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.inrow.live { background: var(--blue-soft); animation: fadein 0.3s ease; }
.inrow.dim { opacity: 0.55; }

/* ---------- settings ---------- */
.settings { flex: 1; min-height: 0; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
.set-nav { border-right: 1px solid var(--line); padding: 12px 8px; display: grid; align-content: start; gap: 1px; overflow-y: auto; }
.set-nav .nav-head { margin-top: 10px; }
.set-nav .nav-head:first-child { margin-top: 0; }
.set-tile { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line); display: grid; place-items: center; background: var(--paper); flex-shrink: 0; }
.set-tile svg, .set-tile .ico { width: 16px; height: 16px; }
.icon-btn.on { background: var(--soft-strong); color: var(--ink); }

/* ---------- calendar ---------- */
.cal-label { font-weight: 500; margin-left: 6px; min-width: 120px; }
.cal-people { display: flex; flex-wrap: wrap; gap: 4px; margin-left: 8px; }
.chip.off { opacity: 0.45; }
.chip .av { width: 16px; height: 16px; font-size: 7.5px; }
.cal { --gut: 56px; min-width: calc(var(--gut) + var(--n) * 150px); padding: 0 12px 12px 0; }
.cal-head { display: grid; grid-template-columns: var(--gut) repeat(var(--n), minmax(0, 1fr)); position: sticky; top: 0; z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); }
.ch { display: flex; align-items: baseline; gap: 6px; padding: 8px 10px; color: var(--muted); font-size: 12.5px; }
.ch b { font-size: 16px; font-weight: 500; color: var(--ink); }
.ch.today b { color: #fff; background: var(--accent); border-radius: 6px; padding: 0 6px; }
.ch.person { align-items: center; }
.ch.person b { font-size: 13px; }
.cal-body { display: grid; grid-template-columns: var(--gut) repeat(var(--n), minmax(0, 1fr)); position: relative; height: calc(11 * 52px); }
.gutter { position: relative; }
.gutter span { position: absolute; right: 10px; transform: translateY(-50%); font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.gutter span:first-child { transform: none; }
.cc { position: relative; border-left: 1px solid var(--line); background: repeating-linear-gradient(to bottom, transparent 0, transparent 51px, var(--line) 51px, var(--line) 52px); }
.heat { position: absolute; left: 0; right: 0; background: var(--soft-strong); pointer-events: auto; }
.cc .now { position: absolute; left: -1px; right: 0; height: 0; border-top: 1.5px solid var(--red); z-index: 3; }
.cc .now::before { content: ""; position: absolute; left: -4px; top: -4.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.cb {
  position: absolute;
  z-index: 2;
  display: grid;
  align-content: start;
  gap: 1px;
  padding: 3px 6px;
  border-radius: 5px;
  font-size: 11.5px;
  line-height: 1.3;
  overflow: hidden;
  text-align: left;
}
.cb b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.cb span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb .avs { display: flex; margin-top: 3px; }
.cb .avs .av { width: 15px; height: 15px; font-size: 7px; box-shadow: 0 0 0 1.5px var(--paper); }
.cb .avs .av + .av { margin-left: -3px; }
.cb.iv { background: color-mix(in srgb, var(--c) 14%, var(--paper)); border-left: 3px solid var(--c); color: var(--ink); }
.cb.iv:hover { background: color-mix(in srgb, var(--c) 22%, var(--paper)); }
.cb.held { background: var(--paper); border: 1px dashed var(--accent); color: var(--ink); }
.cb.held span { color: var(--accent); }
.cb.busy { background: var(--soft-strong); color: var(--muted); }
.cb.busy b { font-weight: 400; }
.cb.free { background: var(--accent-soft); border: 1.5px solid var(--accent); color: var(--accent); z-index: 3; }
.cb.free span { color: var(--accent); }
.cb.free:hover { background: color-mix(in srgb, var(--accent) 22%, var(--paper)); }
.cb.short { padding: 2px 6px; }
.cb.short b span { font-weight: 400; margin-left: 2px; }
.cb .late { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
.cal-legend { display: flex; gap: 16px; padding: 10px 0 0 56px; color: var(--faint); font-size: 12px; }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legend i { width: 10px; height: 10px; border-radius: 3px; }
.lg-heat, .lg-busy { background: var(--soft-strong); }
.lg-iv { background: color-mix(in srgb, var(--accent) 20%, var(--paper)); border-left: 3px solid var(--accent); }
.lg-held { border: 1px dashed var(--accent); }
.lg-free { background: var(--accent-soft); border: 1.5px solid var(--accent); }

/* ---------- observability ---------- */
.obs { padding: 0 0 80px; max-width: none; }
.ochart-wrap { padding: 12px 14px 8px; }
.ochart { width: 100%; height: auto; max-height: 170px; display: block; }
.ochart text { fill: var(--faint); font-size: 10.5px; font-family: var(--sans); }
.ochart .grid { stroke: var(--line); stroke-dasharray: 2 3; }
.ochart .base { stroke: var(--line-strong); }
.ochart .b-ok { fill: var(--blue); opacity: 0.75; }
.ochart .b-fail { fill: var(--red); }
.lg-ok, .lg-fail { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.lg-ok { background: var(--blue); opacity: 0.75; }
.lg-fail { background: var(--red); }
.obs-filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.obs-filters .tab .agent { width: 16px; height: 16px; border-radius: 4px; }
.obs-filters .tab .agent .ltr { font-size: 8.5px; }
.obs-filters .tab .agent svg { width: 10px; height: 10px; }
.orow {
  display: grid;
  grid-template-columns: 14px 104px minmax(0, 1fr) 64px 58px 58px 58px 48px;
  gap: 12px;
  align-items: center;
  min-height: 38px;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
  width: 100%;
  text-align: left;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.orow:last-child { border-bottom: 0; }
button.orow:hover { background: var(--hover); }
.orow.on { background: var(--sel); }
.orow.head { min-height: 32px; color: var(--faint); font-size: 12px; font-weight: 500; }
.orow .r { text-align: right; }
.orow .oa { display: flex; align-items: center; gap: 7px; font-weight: 500; }
.orow .ot { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.odot { width: 8px; height: 8px; border-radius: 50%; display: grid; place-items: center; }
.odot.done { background: var(--line-strong); }
.odot.fail { background: var(--red); }
.odot.wait { background: var(--amber); }
.odot.run { background: transparent; color: var(--blue); }
.odot .ring { width: 10px; height: 10px; border-radius: 50%; border: 1.6px solid color-mix(in srgb, currentColor 25%, transparent); border-top-color: currentColor; animation: spin 0.9s linear infinite; }
.trace { width: 400px; }
.tr-meta { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
.tr-err { color: var(--red); background: var(--red-soft); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; }
.span { display: grid; grid-template-columns: 18px minmax(0, 1fr) 44px; grid-template-rows: auto auto; gap: 3px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.span:last-child { border-bottom: 0; }
.sp-ico { color: var(--muted); display: grid; place-items: center; }
.sp-ico .ico { width: 14px; height: 14px; }
.sp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-dur { text-align: right; color: var(--faint); font-variant-numeric: tabular-nums; }
.sp-track { grid-column: 2 / 4; position: relative; height: 6px; border-radius: 3px; background: var(--soft); }
.sp-track i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--blue); opacity: 0.7; }
.span.fail .sp-track i { background: var(--red); opacity: 1; }
.span.fail .sp-name { color: var(--red); }
.span.wait .sp-track i { background: var(--amber); }
.span.run .sp-track i { animation: pulse2 1s ease-in-out infinite; }
@keyframes pulse2 { 50% { opacity: 0.3; } }

/* ---------- minimal version ---------- */
.trow.min { grid-template-columns: 14px 60px minmax(0, 1fr) auto 18px 40px; height: 40px; }
.trow.min.wide { grid-template-columns: 14px 60px minmax(0, 1fr) 190px auto 18px 40px; }
.trow .tid, .card .tid { white-space: nowrap; }
.trow .jobcell { display: flex; align-items: center; gap: 8px; color: var(--muted); min-width: 0; }
.trow .due { max-width: 280px; }
.trow .due .trunc, .card .due .trunc { max-width: 170px; }
.due .faint { margin-left: 2px; }
.searchbox { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); width: min(420px, 100%); color: var(--faint); }
.searchbox:focus-within { border-color: var(--line-strong); box-shadow: var(--shadow); }
.searchbox input { border: 0; outline: none; background: transparent; flex: 1; min-width: 0; color: var(--ink); }
.searchbox input::placeholder { color: var(--faint); }
.stagebar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.stagebar > button:not(.btn) { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--line); color: var(--muted); font-weight: 450; }
.stagebar > button:not(.btn):hover { color: var(--ink); background: var(--hover); }
.stagebar > button.past { color: var(--ink); }
.stagebar > button.on { color: var(--ink); background: var(--soft-strong); border-color: transparent; font-weight: 500; }
.detail .props .group + .group { border-top: 1px solid var(--line); padding-top: 12px; }
a.logrow:hover { background: var(--hover); }

/* ---------- layer ---------- */
.menu {
  position: fixed;
  z-index: 60;
  min-width: 220px;
  max-width: 300px;
  background: var(--raised);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  box-shadow: var(--pop-shadow);
  padding: 4px;
  animation: pop 0.12s ease-out;
}
@keyframes pop { from { opacity: 0; transform: translateY(-2px) scale(0.985); } }
.menu input { width: 100%; height: 32px; border: 0; border-bottom: 1px solid var(--line); background: transparent; outline: none; padding: 0 8px 4px; margin-bottom: 4px; }
.menu .opts { max-height: 340px; overflow-y: auto; display: grid; gap: 1px; }
.menu .sec { font-size: 11.5px; color: var(--faint); padding: 6px 8px 3px; }
.opt { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border-radius: 5px; text-align: left; width: 100%; }
.opt.hi { background: var(--soft-strong); }
.opt .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .tick { width: 14px; height: 14px; fill: none; stroke: var(--ink); stroke-width: 1.6; }

.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--scrim);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 12vh 16px 16px;
  animation: fade 0.12s ease-out;
}
@keyframes fade { from { opacity: 0; } }
.palette {
  width: min(640px, 100%);
  background: var(--raised);
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  box-shadow: var(--pop-shadow);
  overflow: hidden;
  animation: pop 0.14s ease-out;
}
.palette .ctx { display: flex; gap: 6px; padding: 12px 14px 0; }
.palette input { width: 100%; height: 50px; border: 0; outline: none; background: transparent; padding: 0 16px; font-size: 15px; }
.palette input::placeholder { color: var(--faint); }
.palette .res { border-top: 1px solid var(--line); max-height: 52vh; overflow-y: auto; padding: 6px; }
.palette .sec { font-size: 11.5px; color: var(--faint); padding: 8px 10px 4px; }
.palette .opt { height: 36px; padding: 0 10px; }
.palette .foot { display: flex; gap: 14px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; }
.palette .foot span { display: inline-flex; gap: 5px; align-items: center; }
.plan-card { margin: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); padding: 12px 12px 10px; display: grid; gap: 8px; cursor: pointer; }
.plan-card .h { display: flex; align-items: center; gap: 9px; }
.plan-card .h b { font-weight: 500; }
.plan-card ol { margin: 0; padding-left: 20px; color: var(--muted); font-size: 13px; display: grid; gap: 2px; }
.plan-card .go { color: var(--faint); font-size: 12px; }

.modal {
  width: min(680px, 100%);
  background: var(--raised);
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  box-shadow: var(--pop-shadow);
  animation: pop 0.14s ease-out;
  overflow: hidden;
}
.modal-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 0 14px; font-size: 12.5px; color: var(--muted); }
.modal-head .chip { height: 24px; }
.modal-body { padding: 8px 16px 6px; display: grid; gap: 2px; }
.modal-body .big { border: 0; outline: none; background: transparent; font-size: 18px; font-weight: 500; padding: 6px 0; width: 100%; }
.modal-body .small { border: 0; outline: none; background: transparent; font-size: 13.5px; padding: 4px 0; width: 100%; color: var(--ink); resize: none; min-height: 60px; line-height: 1.5; }
.modal-body ::placeholder { color: var(--faint); }
.modal-props { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 12px; }
.modal-foot { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }

/* ======================================================================
   v6: courts and Grokbots. An applicant is a ticket in someone's court;
   Grokbots (each person's agent) move it between courts.
   ====================================================================== */
.nav-item .count.you { color: var(--accent-ink); background: var(--accent); border-radius: 9px; min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; font-weight: 500; font-size: 11.5px; }

.tdot.none { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }
.side-note { margin-top: auto; display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: start; padding: 10px 10px; border-radius: 8px; background: var(--soft); color: var(--muted); font-size: 12px; line-height: 1.45; }

/* a Grokbot: the person's avatar with a spark badge */
.bot { position: relative; display: inline-grid; flex-shrink: 0; }
.bot > i { position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 1.5px var(--surface); display: grid; place-items: center; }

.bot.lg > i svg { width: 8px; height: 8px; }
.av.cand { background: color-mix(in srgb, var(--muted) 70%, var(--line-strong)); }
.stackav { display: inline-flex; }
.stackav > * + * { margin-left: -5px; }
.stackav .av, .stackav .bot .av { box-shadow: 0 0 0 1.5px var(--surface); }
.stackav.big > * + * { margin-left: -7px; }
.orch { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; background: var(--ink); flex-shrink: 0; }
.orch svg { width: 10px; height: 10px; fill: var(--surface); }
.tb-mark { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; background: var(--ink); flex-shrink: 0; }

.st.spin { animation: spin 1.6s linear infinite; }
.chico { display: inline-grid; place-items: center; flex-shrink: 0; }

/* reads and sentiment */

.readpill .av { width: 16px; height: 16px; font-size: 7.5px; }
.readpill.yes { background: var(--ok-soft); color: var(--ok); }
.readpill.mixed { background: var(--amber-soft); color: var(--amber); }
.readpill.no { background: var(--red-soft); color: var(--red); }
.readpill.lg { height: 28px; padding: 0 12px; font-size: 13.5px; border-radius: 14px; }
.senti { display: inline-block; width: 56px; height: 4px; border-radius: 2px; background: var(--soft-strong); overflow: hidden; flex-shrink: 0; }
.senti i { display: block; height: 100%; border-radius: 2px; background: var(--ink); opacity: 0.7; }

/* your court */
.page.court { max-width: 920px; }

/* triage */
.triage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 24px 18px; overflow: hidden; background: var(--canvas); }
.tri-stage { flex: 0 1 auto; min-height: 0; width: min(880px, 100%); display: flex; }
.tcard { position: relative; flex: 1; min-height: 0; overflow: auto; background: var(--paper); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 32px -18px rgba(0, 0, 0, 0.18); padding: 28px 32px 32px; touch-action: pan-y; user-select: none; cursor: grab; animation: cardin 0.32s cubic-bezier(0.2, 0.8, 0.2, 1); }
.tcard:active { cursor: grabbing; }
@keyframes cardin { from { opacity: 0; transform: translateY(10px) scale(0.985); } }
.stamp { position: absolute; top: 22px; z-index: 3; padding: 4px 12px; border-radius: 8px; font-size: 15px; font-weight: 600; opacity: 0; pointer-events: none; border: 2px solid currentColor; background: var(--paper); }

.tc-head { display: flex; gap: 16px; align-items: flex-start; }

.tc-head p { margin: 3px 0 0; font-size: 16px; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; color: var(--muted); font-size: 13.5px; }
.meta span { display: inline-flex; align-items: center; gap: 4px; }
.meta .ico { width: 13px; height: 13px; }
.tc-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; margin-top: 26px; }

.sum { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; line-height: 1.5; }

.exp { display: grid; margin-top: 18px; border-top: 1px solid var(--line); }

.exp b { font-weight: 500; }
.exp span:nth-child(2) { color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; }
.links a { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; }
.links a:hover { color: var(--ink); }
.links .ico { width: 13px; height: 13px; }
.actionbar { display: flex; gap: 10px; margin-top: 16px; width: min(880px, 100%); justify-content: center; }
.act { flex: 1; max-width: 220px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 44px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--paper); font-weight: 500; font-size: 14px; box-shadow: var(--shadow); transition: background 0.12s, transform 0.12s; }

.act.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.act.go .kbd { background: rgba(255, 255, 255, 0.18); color: inherit; border-color: transparent; }
.tri-hint { margin-top: 10px; color: var(--faint); font-size: 12.5px; display: flex; gap: 5px; align-items: center; }
.tri-done { display: grid; justify-items: center; gap: 8px; padding: 18vh 24px; text-align: center; }

/* Testbench */
.tb { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 14px 14px 12px; display: grid; gap: 12px; align-content: start; }
.tc-side .tb { background: var(--surface); }
.tb-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tb-head b { font-weight: 500; }
.tb-head .faint { margin-left: auto; font-size: 12.5px; }
.tb-head .tb-mark { width: 16px; height: 16px; }

.tb .btn { justify-self: start; }
.tb-score { display: flex; align-items: center; gap: 14px; }
.tb-score > b { font-size: 36px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.tb-score > span { display: grid; gap: 2px; font-size: 13px; }

.tb-prog { height: 5px; border-radius: 3px; background: var(--soft-strong); overflow: hidden; }

/* applicants list */
.trow.arow2 { grid-template-columns: 14px 64px minmax(0, 1fr) 200px 200px 36px 36px; height: 42px; }
.trow .open { position: absolute; inset: 0; z-index: 0; }
.trow > :not(.open) { position: relative; z-index: 1; pointer-events: none; }
.rolecell { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font-size: 12.5px; }
.doing { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; min-width: 0; justify-self: start; max-width: 100%; }
.doing.you { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.doing.bot { color: var(--ink); }
.courtcell { display: flex; justify-content: center; }
.via { display: inline-flex; align-items: center; gap: 7px; color: var(--faint); font-size: 12.5px; }
.members { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; padding: 12px 12px 0; }
.mem { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }

.likes { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; white-space: nowrap; background: var(--soft); color: var(--muted); }
.likes.loves { background: var(--ok-soft); color: var(--ok); }
.likes.avoids { background: var(--soft); color: var(--faint); }
.lbar { display: inline-flex; gap: 2px; }
.lbar i { width: 7px; height: 12px; border-radius: 2px; background: var(--soft-strong); }
.lbar i.on { background: var(--ink); opacity: 0.7; }

/* ticket */
.call-card, .now-card { margin-top: 22px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--paper); box-shadow: var(--shadow); }
.call-card { padding: 16px 18px; display: grid; gap: 12px; }

.cc-head .grow span, .now-card .grow > span { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }

.notes li { position: relative; padding-left: 14px; }
.notes li::before { content: ""; position: absolute; left: 2px; top: 0.6em; width: 4px; height: 4px; border-radius: 50%; background: var(--faint); }
.cc-senti { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.cc-senti .senti { width: 120px; }
.cc-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 4px; }
.cc-acts .btn { height: 32px; padding: 0 12px; }
.cc-hint { margin: 0; color: var(--faint); font-size: 12.5px; }
.now-card { padding: 14px 16px; }
.now-card.closed { box-shadow: none; background: var(--surface); }
.now-av { display: inline-flex; }
.working-dots { display: inline-flex; gap: 4px; }
.working-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--st-3); animation: blink 1.2s infinite ease-in-out; }
.working-dots i:nth-child(2) { animation-delay: 0.15s; }
.working-dots i:nth-child(3) { animation-delay: 0.3s; }
.working-dots.sm i { width: 4px; height: 4px; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.trace2 { display: grid; }
.tev { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 7px 0; position: relative; }
.tev::before { content: ""; position: absolute; left: 10.5px; top: 30px; bottom: -6px; width: 1px; background: var(--line); }
.tev:last-child::before { display: none; }
.tav { display: grid; place-items: center; height: 20px; }
.tline { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 7px; min-height: 20px; font-size: 13px; color: var(--muted); }
.tline .who { color: var(--ink); font-weight: 500; }
.tline .what b { color: var(--ink); font-weight: 500; }
.tline .what .tdot { margin: 0 4px 1px 0; vertical-align: middle; }
.tline .t { color: var(--faint); font-size: 12px; }
.tev.muted .tline { opacity: 0.6; }
.tev.fresh { animation: evin 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes evin { from { opacity: 0; transform: translateY(4px); } }
.bubble { display: inline-block; max-width: 520px; margin-top: 6px; padding: 7px 11px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; background: var(--soft-strong); color: var(--ink); }
.bubble.out { background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
