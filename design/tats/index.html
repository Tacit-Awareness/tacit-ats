    --ev-pink: rgba(244, 114, 182, 0.15); --ev-pink-ink: #f2a3c8;
    --ev-peach: rgba(251, 146, 60, 0.15); --ev-peach-ink: #f5b98a;
    --ev-lav: rgba(167, 139, 250, 0.16); --ev-lav-ink: #c2b2f7;
    --ev-gray: rgba(255, 255, 255, 0.06); --ev-gray-ink: #a0a2a8;
  }
}
.calpage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 100%; }
.cal-main { min-width: 0; border-right: 1px solid var(--line); }
.cal-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.cal-top h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.cal-top p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.cal-top .btn { height: 30px; }
.navpair { display: inline-flex; }
.navpair .btn { border-radius: 0; padding: 0 8px; }
.navpair .btn:first-child { border-radius: 6px 0 0 6px; }
.navpair .btn:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
.cal-top .seg button { height: 26px; padding: 0 10px; }

/* week / day grid */
.wk { --gut: 64px; }
.wk-head, .wk-all { display: grid; grid-template-columns: var(--gut) repeat(var(--n), minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.wk-head { position: sticky; top: 0; z-index: 4; background: var(--surface); }
.wk-day { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 14px; border-left: 1px solid var(--line); }
.wk-day span { color: var(--faint); font-size: 12px; letter-spacing: 0.04em; }
.wk-day b { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.wk-day.today b { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); }
.wk-day.today span { color: var(--accent); }
.wk-all { row-gap: 3px; padding: 5px 0; }
.wk-all .wk-cell { border-left: 1px solid var(--line); margin: -5px 0; }
.wk-all .pill2 { margin: 0 4px; z-index: 1; }
.wk-gl { display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; color: var(--faint); font-size: 11.5px; }
.wk-cell { border-left: 1px solid var(--line); padding: 5px 4px; display: grid; gap: 3px; align-content: start; min-width: 0; }
.pill2 { display: block; height: 22px; line-height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-body { position: relative; display: grid; grid-template-columns: var(--gut) repeat(var(--n), minmax(0, 1fr)); }
.wk-gutter { position: relative; }
.wk-gutter span { position: absolute; right: 10px; transform: translateY(-50%); color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.wk-gutter span:first-child { transform: none; top: 4px !important; }
.wk-col { position: relative; border-left: 1px solid var(--line); min-width: 0; }
.wk-col > i { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
.wk-col.wkend { background: color-mix(in srgb, var(--soft) 55%, transparent); }
.nowline { position: absolute; left: -1px; right: 0; height: 2px; background: var(--red); z-index: 3; }
.nowline::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.ev2 { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 1px; padding: 6px 8px; border-radius: 8px; overflow: hidden; font-size: 12px; line-height: 1.3; transition: filter 0.12s, box-shadow 0.12s; }
.ev2:hover { filter: saturate(1.15) brightness(0.98); box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.15); z-index: 3; }
.ev2 b { font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev2 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.9; }
.ev2 .st2 { margin-top: 2px; font-weight: 500; }
.ev2.hold { background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255, 255, 255, 0.35) 6px 8px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ev-peach-ink) 30%, transparent); }
.ev2.past { opacity: 0.85; }
.blue { background: var(--ev-blue); color: var(--ev-blue-ink); }
.mint { background: var(--ev-mint); color: var(--ev-mint-ink); }
.pink { background: var(--ev-pink); color: var(--ev-pink-ink); }
.peach { background: var(--ev-peach); color: var(--ev-peach-ink); }
.lav { background: var(--ev-lav); color: var(--ev-lav-ink); }
.gray { background: var(--ev-gray); color: var(--ev-gray-ink); }

/* month */
.mo-head, .mo-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.mo-head span { padding: 10px 12px; color: var(--faint); font-size: 12px; letter-spacing: 0.04em; border-bottom: 1px solid var(--line); }
.mo-cell { min-height: 112px; padding: 6px 6px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; gap: 3px; align-content: start; min-width: 0; }
.mo-cell:nth-child(7n) { border-right: 0; }
.mo-cell > b { font-weight: 500; font-size: 13px; padding: 2px 6px; justify-self: start; border-radius: 6px; font-variant-numeric: tabular-nums; }
.mo-cell.today > b { background: var(--accent); color: var(--accent-ink); }
.mo-cell.out { background: color-mix(in srgb, var(--soft) 55%, transparent); }
.mo-cell.out > b { color: var(--faint); }
.mo-ev { display: flex; align-items: center; gap: 5px; height: 20px; padding: 0 5px; border-radius: 5px; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: transparent !important; color: var(--ink) !important; }
.mo-ev:hover { background: var(--hover) !important; }
.mo-ev i { flex-shrink: 0; width: 7px; height: 7px; border-radius: 2px; }
.mo-ev.blue i { background: var(--ev-blue-ink); } .mo-ev.mint i { background: var(--ev-mint-ink); } .mo-ev.pink i { background: var(--ev-pink-ink); } .mo-ev.peach i { background: var(--ev-peach-ink); } .mo-ev.gray i { background: var(--ev-gray-ink); }
.more2 { font-size: 11.5px; padding: 0 6px; }

/* side stats */
.cal-side { padding: 0 0 20px; }
.cs-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 14px; border-bottom: 1px solid var(--line); }
.cs-head b { font-size: 15px; font-weight: 600; }
.cs-row { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: start; padding: 16px 18px 0; }
.cs-row b { display: block; font-weight: 500; font-size: 14px; }
.cs-row span, .cs-row a { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.cs-row a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.sico { display: grid !important; place-items: center; width: 36px; height: 36px; border-radius: 10px; margin: 0 !important; }
.sico .ico { width: 16px; height: 16px; stroke-width: 1.8; }
.sico.green { background: var(--ok-soft); color: var(--ok); }
.sico.orange { background: var(--ev-peach); color: var(--ev-peach-ink); }
.sico.blue { background: var(--ev-blue); color: var(--ev-blue-ink); }
.sico.cyan { background: var(--ev-mint); color: var(--ev-mint-ink); }
.sico.pink { background: var(--ev-pink); color: var(--ev-pink-ink); }
.sico.lav { background: var(--ev-lav); color: var(--ev-lav-ink); }

/* interviews table */
.cal-table { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-bottom: 40px; }
.ct-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px; }
.ct-head b { font-size: 15px; font-weight: 600; }
.ct-row { display: grid; grid-template-columns: 130px minmax(140px, 1fr) minmax(130px, 0.9fr) minmax(140px, 1fr) 110px 84px minmax(200px, 2fr); gap: 14px; align-items: center; min-height: 52px; padding: 0 20px; border-top: 1px solid var(--line); font-size: 13px; }
.ct-row.th { min-height: 38px; background: var(--soft); color: var(--muted); font-size: 12.5px; }
a.ct-row:hover { background: var(--hover); }
.ct-a, .ct-r { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ct-row .spill, .ct-row .readpill { height: 22px; font-size: 12px; padding: 0 8px; }

@media (max-width: 1200px) {
  .calpage { grid-template-columns: 1fr; }
  .cal-main { border-right: 0; }
  .cal-side { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); border-top: 1px solid var(--line); padding-bottom: 16px; }
  .cs-head { grid-column: 1 / -1; }
  .ct-row { grid-template-columns: 120px minmax(140px, 1fr) minmax(140px, 1fr) 110px 84px minmax(160px, 1.4fr); }
  .ct-row > :nth-child(3) { display: none; }
}
@media (max-width: 767px) {
  .cal-top { padding: 12px 14px; }
  .cal-top .seg:first-of-type { order: 9; width: 100%; overflow-x: auto; }
  .wk { --gut: 44px; }
  .wk-day { flex-direction: column; justify-content: center; gap: 0; padding: 0; }
  .wk-gutter span { font-size: 10.5px; right: 6px; }
  .ev2 { padding: 4px 5px; }
  .wk[style*="--n:7"] .ev2 span { display: none; }
  .mo-cell { min-height: 64px; }
  .mo-ev, .mo-cell .pill2 { display: none; }
  .ct-row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; padding: 10px 16px; }
  .ct-row.th { display: none; }
  .ct-row > :nth-child(n+3) { display: none; }
  .ct-row > :nth-child(1) { order: 2; }
}

/* ---------- v10: event card (Google Calendar's popover) ---------- */
.gpop-wrap { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
.gpop { position: fixed; pointer-events: auto; width: 440px; max-height: calc(100vh - 24px); display: flex; flex-direction: column; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 16px; box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.28), 0 4px 12px rgba(0, 0, 0, 0.08); animation: pop 0.16s ease-out; overflow: hidden; }
.gp-tools { display: flex; align-items: center; gap: 2px; padding: 10px 10px 0 12px; }
.gbtn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; color: var(--muted); }
.gbtn:hover { background: var(--hover); color: var(--ink); }
.gbtn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.gp-body { overflow-y: auto; padding: 4px 22px 18px; display: grid; gap: 18px; align-content: start; }
.g-title { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 16px; }
.g-sq { width: 15px; height: 15px; border-radius: 4px; margin-top: 7px; }
.g-sq.blue { background: var(--ev-blue-ink); } .g-sq.mint { background: var(--ev-mint-ink); } .g-sq.pink { background: var(--ev-pink-ink); } .g-sq.peach { background: var(--ev-peach-ink); } .g-sq.gray { background: var(--ev-gray-ink); } .g-sq.lav { background: var(--ev-lav-ink); }
.g-title h3, .g-person h3 { margin: 0; font-size: 21px; font-weight: 500; letter-spacing: -0.012em; line-height: 1.25; }
.g-title p, .g-person p { margin: 4px 0 0; font-size: 14px; color: var(--ink); line-height: 1.4; }
.g-title p.faint, .g-person p.faint { color: var(--muted); font-size: 13px; }
.g-status { margin-top: 10px; }
.g-status .spill, .g-status .readpill { height: 24px; }
.g-hold { margin-left: 38px; padding: 10px 12px; border-radius: 10px; background: var(--ev-peach); color: var(--ev-peach-ink); display: grid; gap: 2px; font-size: 13px; }
.g-hold b { font-weight: 600; }
.g-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.g-row > svg, .g-gran svg { width: 22px; height: 22px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; margin-top: 1px; }
.g-row > svg[viewBox="0 0 24 24"]:has(rect[fill]) { stroke: none; }
.g-gran svg { stroke: none; width: 20px; height: 20px; }
.g-row > div b { display: block; font-weight: 500; font-size: 14px; }
.g-row > div > span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.g-link { color: var(--blue); font-weight: 500; font-size: 15px; }
.g-link:hover { text-decoration: underline; }
.g-row .gbtn { width: 32px; height: 32px; margin-top: -4px; }
.g-guest { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.g-av { position: relative; display: inline-grid; }
.g-av .av, .g-av .bot .av { width: 32px; height: 32px; font-size: 11.5px; }
.g-av > i { position: absolute; right: -4px; bottom: -4px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--raised); }
.g-av > i.ok { background: var(--ok-soft); color: var(--ok); }
.g-av > i.wait { background: var(--amber-soft); color: var(--amber); }
.g-av > i .ico { width: 10px; height: 10px; stroke-width: 2.2; }
.g-guest b { display: block; font-weight: 500; font-size: 14px; }
.g-guest span { display: block; color: var(--muted); font-size: 12.5px; }
.gp-foot { display: flex; align-items: center; gap: 6px; padding: 12px 14px; border-top: 1px solid var(--line); background: var(--soft); flex-shrink: 0; flex-wrap: wrap; }
.gp-tab { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px 0 11px; border-radius: 17px; border: 1px solid var(--line-strong); background: var(--paper); font-weight: 500; font-size: 13px; }
.gp-tab:hover { background: var(--hover); }
.gp-tab.on { background: var(--ev-blue); border-color: transparent; color: var(--ev-blue-ink); }
.gp-tab svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.gp-foot .btn { height: 34px; border-radius: 17px; padding: 0 14px; }
.g-person { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
.g-person .av.xl { width: 44px; height: 44px; font-size: 15px; }
.g-repico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--ev-blue); color: var(--ev-blue-ink); }
.g-repico.red { background: var(--red-soft); color: var(--red); }
.g-repico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.g-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.g-chips .label .pri { width: 12px; height: 12px; }
.g-chips .label .st { width: 12px; height: 12px; }
.g-sec { display: grid; gap: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.g-sec .sum { font-size: 13.5px; }
.g-note { margin: 0; font-size: 14px; line-height: 1.6; }
.g-readhead { display: flex; align-items: center; gap: 10px; }
.g-readhead b { font-weight: 500; flex: 1; }
.g-q { margin: 0; padding-left: 12px; border-left: 2px solid var(--line-strong); font-size: 14.5px; line-height: 1.5; }
.g-slots { display: grid; gap: 6px; }
.g-slot { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; text-align: left; background: var(--paper); }
.g-slot:hover { border-color: var(--line-strong); background: var(--soft); }
.g-slot b { font-weight: 500; flex: 1; }
.g-slot span { color: var(--muted); font-variant-numeric: tabular-nums; }

.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.danger:hover { background: color-mix(in srgb, var(--red) 88%, #000); }
button.pill2 { width: auto; text-align: left; border: 0; cursor: pointer; }
.gpop.sheet { left: 0 !important; right: 0; top: auto !important; bottom: 0; width: 100%; max-height: 86vh; border-radius: 16px 16px 0 0; animation: sheetup 0.22s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes sheetup { from { transform: translateY(24px); opacity: 0; } }
@media (max-width: 767px) {
  .gp-body { padding: 4px 16px 16px; }
  .g-row, .g-title { gap: 12px; }
  .gp-foot .gp-tab { flex: 1; justify-content: center; }

}
@media (max-width: 767px) { .gpop-wrap { background: var(--scrim); pointer-events: auto; animation: fade 0.15s ease-out; } }

/* ---------- v11: drag to add, analytics ---------- */
.calpage { grid-template-columns: minmax(0, 1fr); }
.cal-main { border-right: 0; }
.wk-col { cursor: crosshair; touch-action: pan-y; }
.wk-col:hover > i { background: color-mix(in srgb, var(--line) 100%, var(--ink) 4%); }
.ev2.iv { cursor: grab; touch-action: pan-y; }

.ev2.ghost { background: var(--ev-blue); color: var(--ev-blue-ink); box-shadow: inset 0 0 0 1.5px var(--ev-blue-ink), 0 8px 20px -10px rgba(0, 0, 0, 0.25); z-index: 5; pointer-events: none; animation: none; }
.durs { display: flex; gap: 4px; margin-top: 10px; }
.durs button { height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line-strong); font-size: 12.5px; color: var(--muted); }
.durs button:hover { color: var(--ink); background: var(--hover); }
.durs button.on { background: var(--ev-blue); color: var(--ev-blue-ink); border-color: transparent; font-weight: 500; }
.pick { display: grid; gap: 2px; margin-top: 8px; max-height: 196px; overflow-y: auto; margin-left: -8px; }
.pick-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; text-align: left; }
.pick-row:hover { background: var(--hover); }
.pick-row.on { background: var(--sel); }
.pick-row .grow b { display: block; font-weight: 500; font-size: 13.5px; }
.pick-row .grow span { display: block; color: var(--muted); font-size: 12px; }
.pick-row.warn .grow span { color: var(--amber); }
.pick-row > .ico { width: 15px; height: 15px; color: var(--accent); stroke-width: 2; }
.g-row .switch { margin-top: 2px; }
.gp-foot .hint { font-size: 12.5px; }

/* analytics: data-viz roles, light and dark */
.ana {
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --q1: #e3eefb; --q2: #b9d4f4; --q3: #7fb0ea; --q4: #2a78d6;
  padding: 18px 20px 48px; display: grid; gap: 16px;
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .ana { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --q1: #1d2a3b; --q2: #224a7a; --q3: #2f6ab2; --q4: #4f95ea; } }
:root[data-theme="dark"] .ana { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --q1: #1d2a3b; --q2: #224a7a; --q3: #2f6ab2; --q4: #4f95ea; }
.dk { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: var(--paper); overflow: hidden; }
.kpi { display: grid; gap: 4px; padding: 14px 16px; box-shadow: 1px 0 0 var(--line); }
.dk-i span { color: var(--muted); font-size: 12.5px; }
.dk-i b { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--faint); font-size: 12px; line-height: 1.35; }
a.kpi:hover { background: var(--hover); }
.kpi.alert b { color: var(--red); }
.ana-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.ana-grid .wide { grid-column: 1 / -1; }
.ana-note { margin: 0; padding: 0 16px 14px; color: var(--faint); font-size: 12px; }
.funnel { display: grid; gap: 10px; padding: 16px; }
.fr { display: grid; grid-template-columns: 140px minmax(0, 1fr) 64px; gap: 12px; align-items: center; outline: none; }
.fl { font-size: 13px; color: var(--ink); }
.ftrack { height: 14px; display: block; }
.ftrack i { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }
.fr:hover .ftrack i, .fr:focus .ftrack i { filter: brightness(1.08); }
.fv { display: flex; align-items: baseline; gap: 6px; justify-content: flex-end; font-variant-numeric: tabular-nums; }
.fv b { font-weight: 600; }
.fv small { color: var(--muted); font-size: 12px; min-width: 30px; text-align: right; }
.loadbars { display: grid; gap: 8px; padding: 16px; }
.lr { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; gap: 12px; align-items: center; outline: none; }
.ln { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; }
.ltrack { display: flex; gap: 2px; height: 14px; }
.ltrack i { flex: 1; max-width: 56px; background: var(--soft-strong); border-radius: 2px; }
.ltrack i:last-child { border-radius: 2px 4px 4px 2px; }
.ltrack i.on { background: var(--s1); }
.lv { text-align: right; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hgrid { display: grid; grid-template-columns: 150px repeat(var(--d), minmax(0, 1fr)); gap: 2px; padding: 16px 16px 8px; align-items: center; }
.hgrid .hd { color: var(--faint); font-size: 12px; text-align: center; padding-bottom: 4px; }
.hgrid .hn { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; }
.hc { display: grid; place-items: center; height: 32px; border-radius: 4px; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; outline: none; }
.hc.q0 { background: var(--soft); }
.hc.q1 { background: var(--q1); color: var(--ink); } .hc.q2 { background: var(--q2); color: var(--ink); } .hc.q3 { background: var(--q3); color: #fff; } .hc.q4 { background: var(--q4); color: #fff; }
.hc:hover, .hc:focus { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--ink); }
.heat-key { display: flex; align-items: center; gap: 4px; justify-content: flex-end; padding: 0 16px 14px; color: var(--faint); font-size: 12px; }
.heat-key i { width: 18px; height: 10px; border-radius: 2px; }
.heat-key span:first-child { margin-right: 4px; } .heat-key span:last-child { margin-left: 4px; }
.legend2 { display: inline-flex; gap: 14px; }
.legend2 span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.dotk { width: 9px; height: 9px; border-radius: 50%; }
.dotk.s1, .st3 .dot.s1 { background: var(--s1); } .dotk.s2, .st3 .dot.s2 { background: var(--s2); } .dotk.s3, .st3 .dot.s3 { background: var(--s3); }
.strip { padding: 12px 16px 14px; display: grid; gap: 4px; }
.sr2 { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: center; min-height: 34px; }
.sl { font-size: 13px; }
.st3 { position: relative; height: 34px; border-bottom: 1px solid var(--line); }
.sr2.axis .st3 { border: 0; height: 18px; }
.gl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.st3 .dot { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); outline: none; }
.st3 .dot:hover, .st3 .dot:focus { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); z-index: 2; }
.st3 em { position: absolute; transform: translateX(-50%); font-style: normal; color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.srct { display: grid; }
.srow { display: grid; grid-template-columns: 140px 110px 120px minmax(0, 1fr); gap: 14px; align-items: center; min-height: 44px; padding: 0 16px; border-top: 1px solid var(--line); font-size: 13px; }
.srow.th { min-height: 34px; color: var(--muted); font-size: 12.5px; background: var(--soft); border-top: 0; }
.srow b { font-weight: 500; }
.sbar { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 10px; align-items: center; outline: none; }
.sbt { height: 10px; background: var(--soft-strong); border-radius: 2px 4px 4px 2px; overflow: hidden; }
.sbt i { display: block; height: 100%; background: var(--s1); }
.sbar .num { text-align: right; color: var(--muted); }
.viztip { position: fixed; z-index: 95; pointer-events: none; display: grid; gap: 1px; padding: 7px 10px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line-strong); box-shadow: var(--pop-shadow); font-size: 12px; max-width: 260px; }
.viztip b { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.viztip span { color: var(--muted); }
@media (max-width: 1000px) {
  .ana-grid { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi { box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); }
}
@media (max-width: 767px) {
  .ana { padding: 14px 12px 40px; }
  .fr, .lr { grid-template-columns: 110px minmax(0, 1fr) 54px; gap: 8px; }
  .hgrid, .sr2 { grid-template-columns: 90px repeat(var(--d, 1), minmax(0, 1fr)); }
  .sr2 { grid-template-columns: 90px minmax(0, 1fr); }
  .srow { grid-template-columns: 80px 60px minmax(0, 1fr); }
  .srow > :nth-child(3) { display: none; }
  .legend2 { display: none; }
}

/* ======================================================================
   v12: the calendar wears the reference's skin. Softer type a size up,
   a purple accent, solid pastel blocks, a grey segmented switcher,
   and a table with icon pills. Scoped to #panel.calx.
   ====================================================================== */
:root {
  --ev-blue: #d3e6f8; --ev-blue-ink: #1f4f7d;
  --ev-mint: #c5ecdd; --ev-mint-ink: #1b5d47;
  --ev-pink: #f9d2e4; --ev-pink-ink: #8a2b5b;
  --ev-peach: #fcdcbc; --ev-peach-ink: #7c4516;
  --ev-lav: #e4dcfd; --ev-lav-ink: #5638b8;
  --ev-gray: #eeeef0; --ev-gray-ink: #55555c;
}
.calx {
  --cx-accent: #7255f5; --cx-accent-2: #8467f8; --cx-accent-soft: #efebff; --cx-accent-ink: #5a3fe0;
  --cx-text: #1c1c21; --cx-muted: #77777f; --cx-faint: #a2a2a9; --cx-line: #ededef; --cx-head: #f7f7f8; --cx-paper: #ffffff;
  --q1: #ece7ff; --q2: #cfc3fd; --q3: #a490f9; --q4: #7255f5;
  background: var(--cx-paper);
  color: var(--cx-text);
  font-size: 14px;
  letter-spacing: -0.006em;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .calx { --cx-accent: #8b74ff; --cx-accent-2: #9a86ff; --cx-accent-soft: rgba(139, 116, 255, 0.16); --cx-accent-ink: #b8a9ff; --cx-text: #ececef; --cx-muted: #a0a0a8; --cx-faint: #6f6f78; --cx-line: rgba(255, 255, 255, 0.07); --cx-head: rgba(255, 255, 255, 0.035); --cx-paper: var(--surface); --q1: #2a2440; --q2: #3f3474; --q3: #6050c4; --q4: #8b74ff; }
  :root:not([data-theme="light"]) {
    --ev-blue: rgba(96, 165, 250, 0.18); --ev-blue-ink: #a4cbf6;
    --ev-mint: rgba(52, 211, 153, 0.16); --ev-mint-ink: #8fdcbb;
    --ev-pink: rgba(244, 114, 182, 0.17); --ev-pink-ink: #f3a9cb;
    --ev-peach: rgba(251, 146, 60, 0.17); --ev-peach-ink: #f6bd8f;
    --ev-lav: rgba(167, 139, 250, 0.18); --ev-lav-ink: #c6b6fa;
    --ev-gray: rgba(255, 255, 255, 0.07); --ev-gray-ink: #a6a6ad;
  }
}
:root[data-theme="dark"] .calx { --cx-accent: #8b74ff; --cx-accent-2: #9a86ff; --cx-accent-soft: rgba(139, 116, 255, 0.16); --cx-accent-ink: #b8a9ff; --cx-text: #ececef; --cx-muted: #a0a0a8; --cx-faint: #6f6f78; --cx-line: rgba(255, 255, 255, 0.07); --cx-head: rgba(255, 255, 255, 0.035); --cx-paper: var(--surface); --q1: #2a2440; --q2: #3f3474; --q3: #6050c4; --q4: #8b74ff; }

/* top bar: a title, search, help, one primary action */
.calx .cx-bar { height: 64px; padding: 0 16px 0 22px; gap: 10px; border-color: var(--cx-line); }
.cx-title { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: -0.012em; }
.cx-search { display: flex; align-items: center; gap: 9px; width: 300px; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--cx-line); background: var(--cx-paper); color: var(--cx-faint); transition: border-color 0.15s, box-shadow 0.15s; }
.cx-search:focus-within { border-color: color-mix(in srgb, var(--cx-accent) 45%, var(--cx-line)); box-shadow: 0 0 0 3px var(--cx-accent-soft); }
.cx-search .ico { width: 15px; height: 15px; }
.cx-search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 14px; color: var(--cx-text); }
.cx-search input::placeholder { color: var(--cx-faint); }
.cx-ibtn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--cx-line); color: var(--cx-muted); font-weight: 600; font-size: 14px; }

.cx-primary { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px 0 14px; border-radius: 10px; color: #fff; font-weight: 500; font-size: 14px; background: linear-gradient(180deg, var(--cx-accent-2), var(--cx-accent)); box-shadow: 0 1px 2px rgba(60, 30, 180, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.18); transition: filter 0.15s, transform 0.12s; }
.cx-primary:hover { filter: brightness(1.05); }
.cx-primary:active { transform: scale(0.98); }
.cx-primary svg { width: 13px; height: 13px; fill: currentColor; }

/* header and controls */
.calx .cal-top { padding: 18px 22px; gap: 10px; border-color: var(--cx-line); }
.calx .cal-top h2 { font-size: 19px; font-weight: 500; letter-spacing: -0.014em; }
.calx .cal-top p { font-size: 14px; color: var(--cx-muted); margin-top: 3px; }
.cx-hint { color: var(--cx-faint); }
.cx-btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--cx-line); background: var(--cx-paper); color: var(--cx-text); font-size: 14px; font-weight: 500; white-space: nowrap; transition: background 0.12s; }
.cx-btn:hover { background: var(--cx-head); }
.cx-btn .ico { width: 15px; height: 15px; color: var(--cx-muted); }
.cx-btn .chev { width: 10px; height: 10px; color: var(--cx-faint); }
.cx-btn .team-key { width: 16px; height: 16px; font-size: 9px; }
.cx-pair { display: inline-flex; }
.cx-pair .cx-btn { padding: 0 11px; border-radius: 0; }
.cx-pair .cx-btn:first-child { border-radius: 10px 0 0 10px; }
.cx-pair .cx-btn:last-child { border-radius: 0 10px 10px 0; margin-left: -1px; }
.cx-seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--cx-head); border: 1px solid var(--cx-line); }
.cx-seg button { height: 30px; padding: 0 13px; border-radius: 8px; color: var(--cx-muted); font-size: 14px; font-weight: 450; }
.cx-seg button:hover { color: var(--cx-text); }
.cx-seg button.on { background: var(--cx-paper); color: var(--cx-text); font-weight: 500; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 0 0 1px var(--cx-line); }

/* grid */
.calx .wk-head { background: var(--cx-paper); border-color: var(--cx-line); }
.calx .wk-day { height: 66px; padding: 0 16px; gap: 10px; border-color: var(--cx-line); }
.calx .wk-day span { font-size: 13.5px; color: var(--cx-faint); letter-spacing: 0.02em; }
.calx .wk-day b { font-size: 18px; font-weight: 500; }
.calx .wk-day.today span { color: var(--cx-accent); }
.calx .wk-day.today b { min-width: 30px; height: 30px; border-radius: 8px; background: var(--cx-accent); color: #fff; }
.calx .wk-all { border-color: var(--cx-line); padding: 7px 0; row-gap: 4px; grid-template-rows: none !important; grid-auto-rows: 32px; }
.calx .wk-all .wk-cell { border-color: var(--cx-line); margin: -7px 0; }
.calx .wk-gl { font-size: 13px; color: var(--cx-faint); }
.calx .pill2 { height: 32px; line-height: 32px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500; margin: 0 5px; }
.calx .wk-gutter span { font-size: 13.5px; color: var(--cx-muted); }
.calx .wk-col { border-color: var(--cx-line); }
.calx .wk-col > i { background: var(--cx-line); }
.calx .wk-col.wkend { background: transparent; }
.calx .nowline, .calx .nowline::before { background: var(--cx-accent); }
.calx .ev2 { padding: 8px 11px; border-radius: 9px; gap: 2px; font-size: 13.5px; line-height: 1.32; }
.calx .ev2 b { font-size: 14.5px; font-weight: 500; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.calx .ev2 span { opacity: 1; }
.calx .ev2 .st2 { font-weight: 450; }
.calx .ev2.hold { background-image: none; box-shadow: none; }
.calx .ev2.past { opacity: 1; }
.calx .ev2:hover { filter: brightness(0.98); box-shadow: 0 4px 14px -6px rgba(0, 0, 0, 0.18); }
.calx .ev2.ghost { background: var(--cx-accent-soft); color: var(--cx-accent-ink); box-shadow: inset 0 0 0 1.5px var(--cx-accent); }
.calx .mo-head span { font-size: 13px; color: var(--cx-faint); border-color: var(--cx-line); }
.calx .mo-cell { border-color: var(--cx-line); }
.calx .mo-cell > b { font-size: 14px; }

/* table */
.calx .cal-table { border-color: var(--cx-line); }
.calx .ct-head { padding: 22px 22px 14px; gap: 8px; }
.calx .ct-head b { font-size: 18px; font-weight: 500; letter-spacing: -0.012em; }
.calx .ct-row { grid-template-columns: 150px minmax(150px, 1fr) minmax(170px, 1fr) minmax(150px, 1fr) 140px 64px minmax(200px, 1.8fr); min-height: 62px; padding: 0 22px; border-color: var(--cx-line); font-size: 14.5px; cursor: pointer; }
.calx .ct-row.th { min-height: 46px; background: var(--cx-head); color: var(--cx-muted); font-size: 14px; cursor: default; }

.ct-note { color: var(--cx-text); }
.cx-pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px 0 4px; border-radius: 7px; font-size: 13px; font-weight: 500; border: 1px solid; white-space: nowrap; }
.cx-pill i { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; color: #fff; }
.cx-pill i .ico { width: 10px; height: 10px; stroke-width: 2.4; }
.cx-pill.ok { color: #16804f; background: #ecf8f1; border-color: #c9ecd9; } .cx-pill.ok i { background: #1f9d60; }
.cx-pill.warn { color: #a5600d; background: #fdf4e6; border-color: #f6dfb8; } .cx-pill.warn i { background: #e58a1b; }
.cx-pill.bad { color: #c8333a; background: #fdeeee; border-color: #f6cfd1; } .cx-pill.bad i { background: #e5484d; }
.cx-pill.info { color: #2b63b8; background: #edf3fd; border-color: #cddcf6; } .cx-pill.info i { background: #3b7be0; }
.cx-pill.accent { color: var(--cx-accent-ink); background: var(--cx-accent-soft); border-color: color-mix(in srgb, var(--cx-accent) 25%, transparent); } .cx-pill.accent i { background: var(--cx-accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cx-pill { background: transparent; } }
:root[data-theme="dark"] .cx-pill { background: transparent; }

/* analytics in the same skin */
.calx .ana { --s1: var(--cx-accent); }
.calx .kpis { border-color: var(--cx-line); border-radius: 12px; }
.calx .kpi { grid-template-columns: 40px minmax(0, 1fr); display: grid; gap: 14px; align-items: start; padding: 18px; box-shadow: 1px 0 0 var(--cx-line); }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .on-cal .durs button.on, :root:not([data-theme="light"]) .on-cal .gp-tab.on, :root:not([data-theme="light"]) .on-cal .pick-row.on { background: rgba(139, 116, 255, 0.16); color: #c3b6ff; } }

/* ======================================================================
   v13: one skin everywhere (the calendar's purple and pastels), a floating
   sidebar in three groups, To Do, Applicant tickets, Dashboard, Jobs.
   ====================================================================== */
:root { --accent: #7255f5; --accent-soft: #efebff; --sel: #f4f1ff; --sb-bg: #fbfbfb; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #8b74ff; --accent-soft: rgba(139, 116, 255, 0.16); --sel: rgba(139, 116, 255, 0.12); --sb-bg: #19191c; } }
:root[data-theme="dark"] { --accent: #8b74ff; --accent-soft: rgba(139, 116, 255, 0.16); --sel: rgba(139, 116, 255, 0.12); --sb-bg: #19191c; }
body { font-size: 13.5px; }
.btn.primary { background: linear-gradient(180deg, #8467f8, var(--accent)); border-color: var(--accent); }

/* sidebar: a floating card, three groups */
.side { width: 262px; padding: 10px 0 10px 10px; gap: 0; overflow: visible; }
.main { padding: 10px; }
.sb { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px; border-radius: 18px; background: var(--sb-bg); border: 1px solid var(--line); box-shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.22); overflow-y: auto; scrollbar-width: none; }
.sb-ws { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 4px 0 8px; margin-bottom: 18px; }
.sb-ws .ws-logo { width: 26px; height: 26px; border-radius: 8px; font-size: 12px; background: linear-gradient(135deg, #9b86fa, #7255f5); }
.sb-ws b { flex: 1; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.sb-group { display: grid; gap: 2px; }
.sb-group + .sb-group { margin-top: 32px; }
.sb-label { padding: 0 10px 8px; color: var(--faint); font-size: 12.5px; }
.sb-item { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 10px; color: var(--ink); font-size: 14px; font-weight: 450; width: 100%; text-align: left; transition: background 0.12s; }
.sb-item:hover { background: var(--hover); }
.sb-item.on { background: var(--soft-strong); font-weight: 500; }
.sb-ico { display: grid; place-items: center; width: 20px; height: 20px; flex-shrink: 0; color: var(--muted); }
.sb-ico .ico { width: 18px; height: 18px; stroke-width: 1.4; }
.sb-item.on .sb-ico { color: var(--ink); }
.sb-ico .team-key { width: 18px; height: 18px; font-size: 10px; }
.sb-count { margin-left: auto; color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.sb-count.accent { display: grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 500; font-size: 11.5px; }
.sb-count.red { color: var(--red); font-weight: 500; }
.sb-item.add { color: var(--muted); }
.sb-item.add:hover { color: var(--ink); }
.sb-me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 18px 8px 4px; }
.sb-me .grow b { display: block; font-size: 13.5px; font-weight: 500; }
.sb-me .grow span { display: block; font-size: 12px; color: var(--faint); }
.present .side, .present .phonebar { display: none; }
.present .main { padding: 0; }
.present .panel { border-radius: 0; border: 0; }
.present .dash { zoom: 1.18; max-width: none; }

/* shared: move buttons */
.mv-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink); font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: background 0.12s, border-color 0.12s; }
.mv-btn:hover { background: var(--soft); }
.mv-btn.primary { background: linear-gradient(180deg, #8467f8, var(--accent)); border-color: var(--accent); color: #fff; }
.mv-btn.primary:hover { filter: brightness(1.05); }
.mv-btn.mv-reject:hover, .mv-btn.mv-pass:hover { color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, var(--line-strong)); }
.mv-btn.check .ico { width: 14px; height: 14px; }
.mv-btn.check.on { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.movebar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.movebar > span:first-child { color: var(--muted); font-size: 13px; margin-right: 4px; }

/* To Do */
.page.todo { max-width: 920px; gap: 28px; padding-top: 26px; }
.todo-sum { margin: 0; color: var(--muted); font-size: 15px; }
.td-group { display: grid; gap: 8px; }
.td-group h2 { margin: 0 0 4px; display: flex; align-items: baseline; gap: 8px; font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
.td-group h2 span { color: var(--faint); font-weight: 400; font-size: 14px; }
.td { display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; gap: 4px 12px; padding: 14px 16px 14px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); transition: border-color 0.15s, box-shadow 0.15s; }
.td:hover { border-color: var(--line-strong); box-shadow: 0 6px 18px -14px rgba(0, 0, 0, 0.25); }
.td-check { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-strong); color: transparent; transition: background 0.15s, border-color 0.15s, color 0.15s; }
.td-check:hover { border-color: var(--accent); color: color-mix(in srgb, var(--accent) 50%, transparent); }
.td-check .ico { width: 13px; height: 13px; stroke-width: 2.4; }
.td.done .td-check, .td-check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.td-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
.td-main .grow b { display: block; font-size: 14.5px; font-weight: 500; }
.td-main .grow > span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.td-acts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-left: 36px; }
.td.done { background: transparent; }
.td.done .td-main .grow b { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.donegrp .td { padding-top: 10px; padding-bottom: 10px; }

/* Applicant tickets */
.tk-count { font-size: 15px; margin-left: 2px; }
.tk .mlist { gap: 2px; padding: 8px; }
.tk .mrow { padding: 11px 12px; gap: 2px; border-radius: 10px; }
.tk .m1 b { font-size: 14px; font-weight: 500; }
.tk .m2 { color: var(--muted); font-size: 13px; display: block; }
.tk .mrow.sel { background: var(--sel); }
.tk-card { max-width: 760px; margin: 0 auto; padding: 28px 32px 24px; display: grid; gap: 18px; }
.tk-head { display: flex; align-items: center; gap: 14px; }
.tk-head .av.xl { width: 48px; height: 48px; font-size: 16px; }
.tk-head h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.016em; }
.tk-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.tk-acts { display: flex; gap: 6px; }
.cx-btn.icon { padding: 0 10px; }
.tk-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tk-tags .label { height: 26px; font-size: 12.5px; padding: 0 10px; border-radius: 8px; }
.tk-tags .label.add { color: var(--muted); border-style: dashed; }
.tk-tags .label.add .ico { width: 12px; height: 12px; }
.tk-steps { display: flex; align-items: center; gap: 0; flex-wrap: wrap; row-gap: 6px; }
.tk-step { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; font-size: 13px; color: var(--faint); background: var(--soft); }
.tk-step i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.5; }
.tk-step .ico { width: 13px; height: 13px; stroke-width: 2.2; }
.tk-step.done { background: var(--ev-mint); color: var(--ev-mint-ink); }
.tk-step.now { background: var(--ev-peach); color: var(--ev-peach-ink); }
.tk-line { width: 14px; height: 1px; background: var(--line-strong); }
.tk-mail { border: 1px solid var(--line); border-radius: 14px; background: var(--paper); padding: 18px 20px 16px; display: grid; gap: 14px; }
.tk-from { display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
.tk-from b { font-weight: 500; }
.tk-from > span:nth-child(2) { color: var(--muted); font-size: 13px; }
.tk-body { font-size: 15px; line-height: 1.65; color: var(--ink); max-width: 64ch; }
.tk-files { display: flex; flex-wrap: wrap; gap: 8px; }
.tk-file { display: inline-flex; align-items: center; gap: 10px; padding: 9px 14px 9px 11px; border-radius: 10px; text-align: left; transition: filter 0.12s; }
.tk-file:hover { filter: brightness(0.97); }
.tk-file > span { display: grid; line-height: 1.25; }
.tk-file b { font-weight: 500; font-size: 13px; }
.tk-file small { font-size: 12px; opacity: 0.85; }
.tk-file .ico { width: 16px; height: 16px; }
.tk-file .tb-mark { width: 16px; height: 16px; }
.cx-seg.sm button { height: 28px; padding: 0 12px; font-size: 13.5px; }
.cx-seg.sm { padding: 2px; border-radius: 10px; }
.tk .composer2 { gap: 10px; padding: 12px 18px 14px; }
.tk .composer2 textarea { min-height: 120px; font-size: 14px; border-radius: 10px; }
.sugg { display: inline-flex; align-items: center; gap: 5px; }
.sugg svg { width: 10px; height: 10px; fill: currentColor; }
.tk .c-foot .cx-primary .kbd { background: rgba(255, 255, 255, 0.2); color: #fff; border-color: transparent; }

/* forms */
.modal.fm { width: min(560px, 100%); border-radius: 16px; }
.modal.fm.wide { width: min(720px, 100%); }
.fm-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 18px 6px 22px; }
.fm-head > div { flex: 1; }
.fm-head h3 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: -0.012em; }
.fm-head p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.fm-body { padding: 10px 22px 18px; display: grid; gap: 14px; max-height: 70vh; overflow-y: auto; }
.fm-f { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.fm-f input, .fm-f select, .fm-f textarea { width: 100%; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink); font-size: 14px; outline: none; }
.fm-f textarea { height: auto; padding: 10px 12px; line-height: 1.55; resize: vertical; }
.fm-f input:focus, .fm-f select:focus, .fm-f textarea:focus { border-color: color-mix(in srgb, var(--accent) 45%, var(--line-strong)); box-shadow: 0 0 0 3px var(--accent-soft); }
.fm-f input[readonly] { background: var(--soft); color: var(--muted); }
.fm-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fm-seg { display: flex; flex-wrap: wrap; gap: 6px; }
.fm-seg label { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); color: var(--ink); font-size: 13.5px; cursor: pointer; }
.fm-seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.fm-seg input { position: absolute; opacity: 0; pointer-events: none; }
.fm-seg svg { width: 14px; height: 14px; }
.fm-sugg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
.fm-sugg svg { width: 11px; height: 11px; fill: var(--accent); }
.fm .modal-foot .cx-primary .kbd { background: rgba(255, 255, 255, 0.2); color: #fff; border-color: transparent; }
.doc { border-radius: 12px; }
.doc.paper { padding: 28px 32px; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 8px 24px -18px rgba(0, 0, 0, 0.3); font-size: 14px; line-height: 1.6; }
.doc h4 { margin: 0; font-size: 20px; font-weight: 500; }
.doc h5 { margin: 18px 0 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
.doc-row { display: grid; grid-template-columns: 140px 1fr auto; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.doc-row b { font-weight: 500; }
.doc ul { margin: 0; padding-left: 18px; }

/* Dashboard */
.live { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; color: var(--muted); font-size: 13px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); animation: blink 2s infinite ease-in-out; }
.dash { padding: 22px; display: grid; gap: 18px; max-width: 1280px; margin: 0 auto; }
.d-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.d-tile { display: grid; gap: 2px; padding: 18px 18px 16px; border-radius: 16px; transition: filter 0.12s, transform 0.12s; }
.d-tile:hover { filter: brightness(0.98); transform: translateY(-1px); }
.d-tile b { font-size: 34px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.d-tile span { font-size: 14px; font-weight: 450; }
.d-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.d-card { border: 1px solid var(--line); border-radius: 16px; background: var(--paper); padding: 16px 18px 18px; display: grid; gap: 12px; }
.d-card h2 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
.d-sched { display: grid; gap: 8px; }
.d-ev { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; }
.d-time { display: grid; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; min-width: 52px; }
.d-time small { font-weight: 400; font-size: 12px; opacity: 0.8; }
.d-ev .grow b { display: block; font-weight: 500; font-size: 14.5px; }
.d-ev .grow span { display: block; font-size: 13px; opacity: 0.85; }
.d-pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.d-col { display: grid; gap: 4px; align-content: start; padding: 14px 12px; border-radius: 12px; min-height: 120px; }
.d-col b { font-size: 26px; font-weight: 500; line-height: 1; }
.d-col > span:not(.stackav) { font-size: 12.5px; font-weight: 450; }
.d-col .stackav { margin-top: 8px; }
.d-col .stackav .av { box-shadow: 0 0 0 2px var(--paper); }
.d-feed .lrow { padding-left: 0; padding-right: 0; }
.dash .loadbars { padding: 0; }

/* Jobs */
.page.jobs { max-width: 980px; gap: 14px; padding-top: 24px; }
.job { border: 1px solid var(--line); border-radius: 16px; background: var(--paper); padding: 18px 20px; display: grid; gap: 14px; }
.job-top { display: flex; align-items: center; gap: 12px; }
.job-top .team-key { width: 32px; height: 32px; border-radius: 9px; font-size: 14px; }
.job-top h2 { margin: 0; font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
.job-top p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.job-stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.js { display: grid; gap: 2px; padding: 12px 14px; border-radius: 12px; font-size: 12.5px; }
.js b { font-size: 22px; font-weight: 500; line-height: 1.1; }
.job-tb { margin: 0; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.job-tb .tb-mark { width: 16px; height: 16px; }

@media (max-width: 1100px) {
  .d-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .d-grid { grid-template-columns: 1fr; }
}
@media (max-width: 767px) {
  .side { padding: 0; width: 280px; }
  .sb { border-radius: 0; border: 0; }
  .main { padding: 0; }
  .td-acts { padding-left: 0; grid-column: 1 / -1; }
  .tk-card { padding: 18px 16px; }
  .tk-head { flex-wrap: wrap; }
  .tk-acts { width: 100%; }
  .d-tiles { grid-template-columns: 1fr 1fr; }
  .d-pipe, .job-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fm-row { grid-template-columns: 1fr; }
}

/* ======================================================================
   v14: Linear. A neutral grey frame, a flat sidebar with collapsible
   sections, one white panel with a hairline border, indigo for selection
   and primary actions, quiet text buttons in headers, pill tabs.
   ====================================================================== */
:root {
  --frame: #f5f5f5; --surface: #ffffff; --paper: #ffffff; --raised: #ffffff;
  --ink: #1b1b1f; --muted: #66686f; --faint: #9a9ca3;
  --line: #ebebed; --line-strong: #dfdfe2; --soft: #f4f4f5; --soft-strong: #eaeaec; --band: #f4f4f5;
  --hover: rgba(0, 0, 0, 0.035); --sel: #f0f1fb;
  --accent: #5e6ad2; --accent-soft: #eceefb; --sb-bg: transparent;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --frame: #0e0e10; --surface: #151517; --paper: #18181b; --raised: #1d1d20;
    --ink: #e8e8ea; --muted: #9b9da4; --faint: #6b6e75;
    --line: rgba(255, 255, 255, 0.07); --line-strong: rgba(255, 255, 255, 0.11); --soft: rgba(255, 255, 255, 0.04); --soft-strong: rgba(255, 255, 255, 0.075); --band: rgba(255, 255, 255, 0.035);
    --hover: rgba(255, 255, 255, 0.035); --sel: rgba(113, 112, 255, 0.1); --accent: #7170ff; --accent-soft: rgba(113, 112, 255, 0.14);
  }
}
:root[data-theme="dark"] {
  --frame: #0e0e10; --surface: #151517; --paper: #18181b; --raised: #1d1d20;
  --ink: #e8e8ea; --muted: #9b9da4; --faint: #6b6e75;
  --line: rgba(255, 255, 255, 0.07); --line-strong: rgba(255, 255, 255, 0.11); --soft: rgba(255, 255, 255, 0.04); --soft-strong: rgba(255, 255, 255, 0.075); --band: rgba(255, 255, 255, 0.035);
  --hover: rgba(255, 255, 255, 0.035); --sel: rgba(113, 112, 255, 0.1); --accent: #7170ff; --accent-soft: rgba(113, 112, 255, 0.14);
}
body { font-size: 14px; letter-spacing: -0.003em; }
.calx {
  --cx-accent: var(--accent); --cx-accent-2: var(--accent); --cx-accent-soft: var(--accent-soft); --cx-accent-ink: var(--accent);
  --cx-text: var(--ink); --cx-muted: var(--muted); --cx-faint: var(--faint); --cx-line: var(--line); --cx-head: var(--soft); --cx-paper: var(--paper);
  --q1: #e8eafa; --q2: #c4c9f2; --q3: #8d96e3; --q4: #5e6ad2;
  letter-spacing: -0.003em;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .calx { --q1: #23243d; --q2: #34386e; --q3: #4f56b8; --q4: #7170ff; --cx-paper: var(--paper); } }
:root[data-theme="dark"] .calx { --q1: #23243d; --q2: #34386e; --q3: #4f56b8; --q4: #7170ff; --cx-paper: var(--paper); }

/* frame and panel */
.app { background: var(--frame); }
.side { width: 252px; padding: 10px 4px 10px 10px; }
.main { padding: 10px 10px 10px 6px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.025); }

/* sidebar: flat on the frame */
.sb { background: transparent; border: 0; box-shadow: none; border-radius: 0; padding: 0 4px 0 0; }
.sb-ws { gap: 4px; height: 40px; padding: 0 0 0 2px; margin-bottom: 14px; }
.sb-org { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 8px; border-radius: 8px; text-align: left; }
.sb-org:hover { background: var(--hover); }
.sb-org b { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
.sb-org .chev { width: 10px; height: 10px; color: var(--muted); flex-shrink: 0; }
.sb-ws .ws-logo { width: 22px; height: 22px; border-radius: 6px; font-size: 11px; background: linear-gradient(135deg, #8b93e6, #5e6ad2); }
.sb-ws .icon-btn { width: 32px; height: 32px; }
.sb-ws .icon-btn.round { border-radius: 50%; border: 1px solid var(--line-strong); background: var(--paper); box-shadow: 0 1px 1px rgba(0, 0, 0, 0.04); color: var(--ink); }
.sb-group + .sb-group { margin-top: 20px; }
.sb-sec { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; color: var(--muted); font-size: 13.5px; font-weight: 450; width: 100%; text-align: left; }
.sb-sec:hover { background: var(--hover); color: var(--ink); }
.sb-sec .tri { width: 8px; height: 8px; fill: currentColor; transition: transform 0.15s; }
.sb-group.shut .sb-sec .tri { transform: rotate(-90deg); }
.sb-group.shut .sb-item { display: none; }
.sb-item { height: 34px; padding: 0 10px; gap: 10px; border-radius: 8px; font-size: 14.5px; font-weight: 450; }
.sb-item.on { background: var(--soft-strong); font-weight: 500; }
.sb-ico .ico { width: 17px; height: 17px; stroke-width: 1.35; }
.sb-count { color: var(--muted); font-size: 13px; }
.sb-count.accent { background: none; color: var(--ink); min-width: 0; height: auto; padding: 0; font-size: 13px; font-weight: 500; }
.sb-me { padding: 14px 8px 6px; }
.sb-foot { display: flex; align-items: center; gap: 6px; padding: 4px 2px 0 4px; }
.sb-help { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--paper); color: var(--muted); font-size: 13px; font-weight: 500; }
.sb-help:hover { color: var(--ink); }
.sb-agent { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 8px; color: var(--muted); font-size: 13.5px; }
.sb-agent:hover { background: var(--hover); color: var(--ink); }
.sb-agent svg { width: 11px; height: 11px; fill: currentColor; }

/* headers: a title and quiet text actions */
.bar, .calx .cx-bar { height: 56px; padding: 0 14px 0 22px; border-color: var(--line); gap: 6px; }
.cx-title { font-size: 15px; font-weight: 500; letter-spacing: -0.008em; }
.crumbs { font-size: 14.5px; }
.bar .cx-primary, .calx .cx-bar .cx-primary { height: 32px; padding: 0 11px; border-radius: 8px; background: none; color: var(--ink); box-shadow: none; font-weight: 450; font-size: 14px; filter: none; }
.bar .cx-primary:hover { background: var(--hover); }
.bar .cx-primary svg { width: 13px; height: 13px; color: var(--muted); fill: currentColor; }
.bar .cx-primary .ico { width: 15px; height: 15px; fill: none; stroke: var(--muted); }
.cx-primary { background: var(--accent); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.cx-primary:hover { filter: brightness(1.06); }
.cx-btn, .calx .cx-btn { height: 32px; padding: 0 12px; border-radius: 8px; border-color: var(--line-strong); font-size: 13.5px; }
.cx-ibtn { width: 32px; height: 32px; border-radius: 50%; border-color: var(--line-strong); }
.cx-search { height: 32px; border-radius: 8px; width: 260px; }
.cx-pair .cx-btn:first-child { border-radius: 8px 0 0 8px; } .cx-pair .cx-btn:last-child { border-radius: 0 8px 8px 0; }
/* pill tabs, as Linear's Active / Backlog / All */
.cx-seg { background: none; border: 0; padding: 0; gap: 6px; border-radius: 0; }
.cx-seg button, .cx-seg.sm button { height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line-strong); color: var(--ink); font-size: 14px; font-weight: 450; }
.cx-seg button:hover { background: var(--hover); }
.cx-seg button.on { background: var(--soft-strong); border-color: transparent; font-weight: 500; box-shadow: none; }
.cx-seg.sm button { height: 28px; padding: 0 12px; font-size: 13.5px; }
.tabs .tab { height: 32px; padding: 0 14px; border-radius: 16px; font-size: 14px; }
.tab.on { background: var(--soft-strong); }
.seg { background: none; border: 0; padding: 0; gap: 4px; }
.seg button { height: 32px; width: 32px; justify-content: center; padding: 0; border-radius: 50%; border: 1px solid var(--line-strong); }
.seg button.on { background: var(--soft-strong); border-color: transparent; box-shadow: none; }
.runs-bar .seg button { width: auto; padding: 0 12px; border-radius: 16px; font-size: 13.5px; }

/* buttons */
.btn { height: 32px; border-radius: 8px; font-size: 13.5px; }
.btn.primary, .mv-btn.primary, .on-cal .gpop .btn.primary { background: var(--accent); border-color: var(--accent); }
.mv-btn { height: 30px; border-radius: 8px; font-size: 13.5px; font-weight: 450; border-color: var(--line-strong); }
.mv-btn.primary { font-weight: 500; }
.sb-ws .ws-logo, .cx-primary, .mv-btn.primary, .btn.primary { background-image: none; }

/* lists: roomier rows, Linear's band */
.group-head { height: 40px; border-radius: 8px; margin: 0 10px; font-weight: 500; font-size: 14.5px; }
.list .group-head ~ .group-head { margin-top: 8px; }
.trow.arow2 { height: 46px; padding: 0 20px 0 16px; }
.trow .title b { font-weight: 500; font-size: 14.5px; }
.trow .title .hl { font-size: 14px; }
.trow .tid { font-size: 13.5px; }
.trow .when { font-size: 13.5px; color: var(--muted); }
.doing { height: 26px; border-radius: 13px; font-size: 13px; }
.subbar { padding: 12px 14px; }

/* cards: calmer */
.td, .job, .d-card, .tk-mail, .cardbox, .stats, .kpis, .call-card, .now-card, .tb, .mail { border-radius: 10px; box-shadow: none; }
.td:hover { box-shadow: none; border-color: var(--line-strong); }
.d-tile, .d-col, .js { border-radius: 10px; }
.page.todo { padding-top: 22px; }
.td-group h2 { font-size: 15px; }
.modal, .modal.fm, .palette, .gpop { border-radius: 12px; }
.menu { border-radius: 10px; }
.opt { height: 32px; border-radius: 6px; }

/* the accent everywhere it was purple */
.sb-count.accent, .count.you { color: var(--ink); }
.calx .wk-day.today b, .calx .mo-cell.today > b { background: var(--accent); }
.calx .nowline, .calx .nowline::before { background: var(--red); }
.calx .ev2.ghost { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.on-cal .durs button.on, .on-cal .gp-tab.on, .g-found { background: var(--accent-soft); color: var(--accent); }
.on-cal .pick-row.on { background: var(--sel); }
.on-cal .pick-row > .ico, .on-cal .g-link { color: var(--accent); }
.on-cal .switch.on, .switch.on { background: var(--accent); }
.mrow.sel::before { background: var(--accent); }
.tk .mrow.sel { background: var(--sel); }
.fm-seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.fm-f input:focus, .fm-f select:focus, .fm-f textarea:focus { border-color: color-mix(in srgb, var(--accent) 45%, var(--line-strong)); box-shadow: 0 0 0 3px var(--accent-soft); }
.cx-search:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 0 0 3px var(--accent-soft); }
.cx-pill.accent { color: var(--accent); background: var(--accent-soft); border-color: transparent; } .cx-pill.accent i { background: var(--accent); }
.sugg { color: var(--accent); background: var(--accent-soft); }
.td-check:hover { border-color: var(--accent); color: color-mix(in srgb, var(--accent) 50%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sb-ws .icon-btn.round, :root:not([data-theme="light"]) .sb-help { background: var(--raised); } }

@media (max-width: 767px) {
  .side { padding: 10px 8px 10px 10px; width: 272px; background: var(--frame); }
  .main { padding: 0; }
  .panel { border-radius: 0; border: 0; }
}
.sb-ws .ws-logo, .phonebar .ws-logo { background: #5e6ad2; color: #fff; }
/* Linear keeps colour to small marks: tiles and counts go neutral with a tone dot */
.blue { --tone: var(--ev-blue-ink); } .mint { --tone: var(--ev-mint-ink); } .pink { --tone: var(--ev-pink-ink); } .peach { --tone: var(--ev-peach-ink); } .lav { --tone: var(--ev-lav-ink); } .gray { --tone: var(--ev-gray-ink); }
.d-tile, .js, .d-col { background: var(--paper) !important; color: var(--ink) !important; border: 1px solid var(--line); }
.d-tile:hover, .d-col:hover { background: var(--soft) !important; filter: none; transform: none; }
.d-tile span, .js > :not(b), .d-col > span:not(.stackav) { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.d-tile span::before, .d-col > span:not(.stackav)::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tone); flex-shrink: 0; }
.js { position: relative; padding-left: 26px; }
.js::before { content: ""; position: absolute; left: 12px; top: 18px; width: 8px; height: 8px; border-radius: 50%; background: var(--tone); }
.d-tile b, .d-col b, .js b { color: var(--ink); font-weight: 500; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .blue { --tone: #7fb0f0; } :root:not([data-theme="light"]) .mint { --tone: #5fd0a2; } :root:not([data-theme="light"]) .pink { --tone: #ee8fbd; } :root:not([data-theme="light"]) .peach { --tone: #f2a66b; } :root:not([data-theme="light"]) .lav { --tone: #a996f7; } }

/* ---------- v15: layers, calmer To Do, the tracking board ---------- */
.cx-seg a { display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line-strong); color: var(--ink); font-size: 14px; font-weight: 450; }
.cx-seg a:hover { background: var(--hover); }
.cx-seg a.on { background: var(--soft-strong); border-color: transparent; font-weight: 500; }
/* To Do: one line, one action */
.td { grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; padding: 12px 14px; }
.td-act { display: flex; align-items: center; }
.td-act .mv-btn { height: 30px; }
.td-act .chev { width: 10px; height: 10px; color: var(--muted); }
.td .readpill { margin-left: 8px; }
.td-group h2 { font-size: 14px; color: var(--muted); font-weight: 500; margin-bottom: 2px; }
.td-group h2 span { font-size: 13px; }
/* tracking */
.page.track { max-width: 1400px; gap: 20px; padding-top: 22px; }
.tr-attn { display: grid; gap: 8px; }
.tr-attn h2 { margin: 0 0 2px; display: flex; gap: 8px; align-items: baseline; font-size: 14px; font-weight: 500; color: var(--muted); }
.tr-attn h2 span { color: var(--red); font-weight: 500; }
.tr-a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--red) 25%, var(--line)); border-radius: 10px; background: var(--paper); }
.tr-a .grow b { display: block; font-weight: 500; font-size: 14.5px; }
.tr-a .grow span { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
.lanes { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 10px; align-items: start; overflow-x: auto; padding-bottom: 6px; }
.lane { display: grid; gap: 6px; padding: 8px; border-radius: 10px; background: var(--soft); min-height: 160px; align-content: start; }
.lane-h { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px; font-weight: 500; font-size: 13.5px; }
.lane-h span { color: var(--faint); font-weight: 400; }
.lane-h .ldot { width: 8px; height: 8px; }
.lane-empty { margin: 4px 6px; color: var(--faint); font-size: 13px; }
.tc { display: grid; gap: 6px; padding: 10px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); text-align: left; width: 100%; transition: border-color 0.12s, box-shadow 0.12s; }
.tc:hover { border-color: var(--line-strong); box-shadow: 0 4px 12px -8px rgba(0, 0, 0, 0.2); }
.tc.stuck { border-color: color-mix(in srgb, var(--red) 40%, var(--line)); box-shadow: inset 3px 0 0 var(--red); }
.tc-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tc-top b { flex: 1; font-weight: 500; font-size: 14px; }
.tc-top .team-key { width: 16px; height: 16px; font-size: 9px; }
.tc-line { color: var(--ink); font-size: 13px; line-height: 1.4; }
.tc.stuck .tc-line { color: var(--red); }
.tc-foot { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
@media (max-width: 767px) {
  .td { grid-template-columns: 28px minmax(0, 1fr); }
  .td-act { grid-column: 2; }
  .td .readpill { display: none; }
  .lanes { grid-template-columns: repeat(5, 240px); }
}

/* ================= v16: Inbox, read like email (Linear inbox) ================= */
.ib-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(360px, 42%) minmax(0, 1fr); }
.ib-col { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.ib-bar { gap: 4px; }
.ib-bar .cx-title { margin-right: 2px; }
.ib-fchip { margin-left: 6px; height: 24px; font-size: 12px; }
.ib-fchip svg { width: 11px; height: 11px; }
.ib-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0 12px; }
.ib-none { padding: 40px 24px; color: var(--muted); text-align: center; }
.ib { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 12px; row-gap: 3px; align-items: center; width: 100%; padding: 12px 20px; text-align: left; color: var(--muted); position: relative; transition: background 0.1s; }
.ib:hover { background: var(--hover); }
.ib.sel { background: var(--sel); }
.ib-av { grid-row: 1 / 3; position: relative; width: 32px; height: 32px; display: grid; place-items: center; }
.ib-av .av, .ib-av .av.lg { width: 32px; height: 32px; font-size: 12px; }
.ib-av .bot > i { display: none; }
.ib-av .stackav > :not(:first-child) { display: none; }
.ib-av .orch.lg { width: 32px; height: 32px; border-radius: 50%; }
.ib-av .orch.lg svg { width: 14px; height: 14px; }
.ib-badge { position: absolute; right: -4px; bottom: -3px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--soft-strong); color: var(--muted); box-shadow: 0 0 0 2px var(--paper); font: 700 10px/1 var(--sans); font-style: normal; }
.ib.sel .ib-badge { box-shadow: 0 0 0 2px var(--sel); }
.ib-badge svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ib-badge.b-bot svg { fill: currentColor; stroke: none; }
.ib-badge.b-warn { background: var(--orange); color: #fff; }
.ib-badge.b-read { background: var(--accent); color: #fff; }
.ib-l1 { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 13.5px; line-height: 1.3; }
.ib-l1 .trunc { min-width: 0; }
.ib-l1 b { font-weight: 500; }
.ib.unread .ib-l1 { color: var(--ink); }
.ib.unread .ib-l1 b { font-weight: 600; }
.ib-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.ib-id { color: var(--faint); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.ib.unread .ib-id { color: var(--muted); }
.ib-l2 { grid-column: 2; font-size: 13px; color: var(--muted); }
.ib-st { grid-column: 3; grid-row: 1; justify-self: end; display: grid; }
.ib-t { grid-column: 3; grid-row: 2; justify-self: end; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ib-due { width: 14px; height: 14px; border-radius: 3px; display: grid; place-items: center; background: var(--orange); color: #fff; font: 700 10px/1 var(--sans); font-style: normal; }
.ib-reader { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--paper); }
.ib-empty { flex: 1; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 24px; }
.ib-empty p { margin: 6px 0 0; font-size: 15px; color: var(--ink); }
.ib-empty .faint { font-size: 12px; display: flex; align-items: center; gap: 4px; }
.ib-tray { width: 88px; height: 88px; fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
.ib-top { display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 16px 0 24px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.ib-crumb { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; font-weight: 500; }
.ib-back { display: none; }
.ib-read { max-width: 760px; margin: 0 auto; padding: 28px 40px 48px; }
.ib-head { display: flex; align-items: center; gap: 14px; }
.ib-head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.ib-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.ib-read .chips { margin-top: 16px; }
.ib-call { margin-top: 22px; }
.ib-read .block { margin-top: 28px; }
@media (max-width: 1100px) { .ib-wrap { grid-template-columns: minmax(320px, 46%) minmax(0, 1fr); } .ib-read { padding: 24px 28px 40px; } }
@media (max-width: 760px) {
  .ib-wrap { grid-template-columns: 1fr; }
  .ib-wrap.has-sel .ib-col, .ib-wrap:not(.has-sel) .ib-reader { display: none; }
  .ib-col { border-right: 0; }
  .ib { padding: 12px 16px; }
  .ib-top { padding: 0 8px; }
  .ib-back { display: inline-grid; }
  .ib-read { padding: 20px 16px 40px; }
}
.ib-bar [data-act="ibMore"] svg { stroke-width: 2.6; }
@media (max-width: 760px) { .ib-read .now-card { flex-wrap: wrap; } .ib-read .now-card .grow { flex-basis: calc(100% - 48px); } }

/* ================= v17: source handles instead of numbers; activity as a short story ================= */
.handle { flex-shrink: 0; font-size: 11.5px; font-weight: 500; line-height: 18px; padding: 0 6px; border-radius: 5px; background: var(--soft); color: var(--muted); }
.handle.s-referral { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.handle.s-tacit { background: var(--accent-soft); color: var(--accent); }
.ib-l1 .handle { margin-left: 2px; }
.ib:not(.unread) .handle { opacity: 0.8; }
.trow .tid .handle, .card .tid .handle { font-size: 11.5px; }
.ib-meta { margin: 10px 0 0; font-size: 12.5px; color: var(--faint); }
.block-head a.aside, .linkish { color: var(--muted); font-size: 12.5px; font-weight: 400; }
.block-head a.aside:hover, .linkish:hover { color: var(--ink); }
.story { list-style: none; margin: 4px 0 0; padding: 0; position: relative; }
.sy { position: relative; padding-left: 28px; }
.sy::before { content: ""; position: absolute; left: 8.5px; top: 0; bottom: 0; width: 1px; background: var(--line-strong); }
.sy:first-child::before { top: 18px; }
.sy:last-child::before { bottom: calc(100% - 18px); }
.sy-mark { position: absolute; left: 0; top: 9px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); box-shadow: 0 0 0 1px var(--line-strong) inset; color: var(--faint); z-index: 1; font: 700 10px/1 var(--sans); }
.sy-mark svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sy.done .sy-mark { background: var(--soft); box-shadow: none; color: var(--muted); }
.sy.wait .sy-mark { box-shadow: 0 0 0 1.5px var(--amber) inset; }
.sy.wait .sy-mark i { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
.sy.fail .sy-mark { background: var(--orange); box-shadow: none; color: #fff; }
.sy.you .sy-mark { box-shadow: none; background: var(--accent-soft); }
.sy.you .sy-mark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.sy.next .sy-mark { box-shadow: 0 0 0 1px var(--accent) inset; color: var(--accent); border-style: dashed; }
.sy-main { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: start; width: 100%; padding: 8px 8px 9px; border-radius: 8px; text-align: left; }
button.sy-main:hover { background: var(--hover); }
.sy-who { padding-top: 1px; }
.sy-who .av, .sy-who .orch { width: 20px; height: 20px; font-size: 8.5px; }
.sy-who .bot > i { display: none; }
.sy-who .stackav > :not(:first-child) { display: none; }
.sy-text { display: grid; gap: 2px; min-width: 0; }
.sy-text b { font-weight: 500; font-size: 13.5px; color: var(--ink); }
.sy-text span { color: var(--muted); font-size: 13px; line-height: 1.45; }
.sy.next .sy-text b { color: var(--accent); }
.sy.fail .sy-text b { color: var(--red); }
.sy-when { display: flex; align-items: center; gap: 4px; color: var(--faint); font-size: 12px; white-space: nowrap; padding-top: 2px; font-variant-numeric: tabular-nums; }
.sy-when .chev { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5; transition: transform 0.15s; }
[aria-expanded="true"] .sy-when .chev { transform: rotate(180deg); }
.sy-steps { margin: 0 8px 8px 38px; padding: 6px 0 6px 12px; border-left: 2px solid var(--line); display: grid; gap: 6px; }
.sx { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.sx .av, .sx .orch, .sx .tb-mark { width: 16px; height: 16px; font-size: 7px; flex-shrink: 0; margin-top: 1px; }
.sx .bot > i { display: none; }
.sx b { color: var(--ink); font-weight: 500; }
.sx.muted { opacity: 0.6; }
.sx.err { color: var(--red); }
.sx-q { display: block; color: var(--faint); margin-top: 1px; }

/* ================= v18: Job postings, laid out like the careers page ================= */
.jp { max-width: 760px; margin: 0 auto; padding: 56px 24px 80px; }
.jp-hero { margin: 0 0 44px; text-align: center; font-size: 40px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.1; }
.jp-head { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; color: var(--faint); font-size: 13px; }
.jp-head .ico { width: 14px; height: 14px; }
.jp-add, .jp-tplus { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 7px; color: var(--muted); font-size: 13px; font-weight: 500; }
.jp-add:hover, .jp-tplus:hover { background: var(--hover); color: var(--ink); }
.jp-add .ico, .jp-tplus .ico { width: 13px; height: 13px; }
.jp-team { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.jp-fold { flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; text-align: left; font-size: 13.5px; }
.jp-fold .chev { width: 11px; height: 11px; color: var(--faint); transition: transform 0.15s; }
.jp-fold[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.jp-fold .ico { width: 14px; height: 14px; color: var(--muted); }
.jp-fold b { font-weight: 500; }
.jp-fold span { color: var(--faint); }
.jp-tplus { width: 28px; padding: 0; justify-content: center; opacity: 0; margin-right: 6px; }
.jp-team:hover .jp-tplus, .jp-tplus:focus-visible { opacity: 1; }
.jp-row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto 44px; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 10px 0 34px; border-bottom: 1px solid var(--line); text-align: left; transition: background 0.1s; }
.jp-row:hover { background: var(--hover); }
.jp-row > .ico { width: 14px; height: 14px; color: var(--faint); }
.jp-t { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 13.5px; }
.jp-t b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jp-t span { color: var(--faint); white-space: nowrap; }
.jp-t .jp-new { color: var(--accent); font-size: 12px; font-weight: 500; }
.jp-row.paused .jp-t b { color: var(--muted); }
.jp-n { color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.jp-loc { color: var(--muted); font-size: 13px; }
.jp-edit { color: var(--faint); font-size: 13px; font-weight: 500; text-align: right; opacity: 0; transition: opacity 0.1s; }
.jp-row:hover .jp-edit, .jp-row:focus-visible .jp-edit { opacity: 1; color: var(--ink); }
.icon-btn.round.jp-plus { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--paper); }
.icon-btn.round.jp-plus:hover { background: var(--ink); opacity: 0.88; }
@media (max-width: 760px) {
  .jp { padding: 32px 16px 60px; }
  .jp-hero { font-size: 30px; margin-bottom: 28px; }
  .jp-row { grid-template-columns: 16px minmax(0, 1fr) auto; padding-left: 26px; }
  .jp-n, .jp-edit { display: none; }
  .jp-tplus { opacity: 1; }
}

/* Analytics page */
.anapage { max-width: 1100px; }
.ana2 { --c1: #1baf7a; --c2: #2a78d6; --c3: #eb6834; display: grid; gap: 16px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ana2 { --c1: #199e70; --c2: #3987e5; --c3: #d95926; } }
:root[data-theme="dark"] .ana2 { --c1: #199e70; --c2: #3987e5; --c3: #d95926; }
.ana2 .dk-i b { font-size: 24px; }
.ana2 .dotk.c1 { background: var(--c1); } .ana2 .dotk.c2 { background: var(--c2); } .ana2 .dotk.c3 { background: var(--c3); }
.wchart { width: 100%; height: auto; display: block; }

/* Careers page: a soft tray holding KPI cards and a white chart card */
.an { background: var(--soft); border-radius: 20px; padding: 8px; display: grid; gap: 8px; }

.an-card { background: var(--paper); border-radius: 14px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 0 0 1px var(--line); overflow: hidden; }

.ex-plot { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); border-bottom: 1px solid var(--line-strong); }

:is(.ex-stack, .ex) i.p1, .ex .sq.p1 { background: var(--p1); } :is(.ex-stack, .ex) i.p2, .ex .sq.p2 { background: var(--p2); } :is(.ex-stack, .ex) i.p3, .ex .sq.p3 { background: var(--p3); } :is(.ex-stack, .ex) i.p4, .ex .sq.p4 { background: var(--p4); } :is(.ex-stack, .ex) i.p0, .ex .sq.p0 { background: var(--p0); }

@media (max-width: 760px) {

.ex { width: 100%; box-sizing: border-box; }

/* ================= v22: blocked-step card, sidebar faces, applicant document viewer ================= */
/* Blocked step: neutral card, a small status mark, facts on one line, the fix on the right */
.blk { display: flex; align-items: center; gap: 12px; margin-top: 22px; padding: 12px 12px 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--paper); box-shadow: var(--shadow); }

/* Applicant tickets: header, then the document, then a one-line reply bar */
.tk-top { display: flex; align-items: center; gap: 14px; padding: 16px 20px 10px; }

}

/* ================= v24: confirm before acting ================= */

/* ================= v25: Pipeline rows behave like Linear issue rows ================= */

/* ================= v26: hover cards ================= */
.hcard { position: fixed; z-index: 60; width: 320px; padding: 14px; border-radius: 12px; background: var(--raised); box-shadow: var(--pop-shadow), 0 0 0 1px var(--line); display: grid; gap: 12px; font-size: 13px; animation: hcardIn 0.14s ease-out; }

/* ================= v27: a quieter Inbox ================= */
.ib { grid-template-columns: 32px minmax(0, 1fr) auto; padding: 12px 20px 12px 18px; }

/* ================= v29: Interviews and Settings ================= */

/* directory */

.iv-r { display: grid; grid-template-columns: minmax(220px, 1.8fr) minmax(140px, 1fr) 70px 64px 120px 104px; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; }

/* detail, laid out like a call review */
.rec { max-width: 860px; }
.rc { border: 1px solid var(--line); border-radius: 20px; background: var(--paper); overflow: hidden; }
.rc-head { display: flex; align-items: center; gap: 16px; padding: 22px 26px; border-bottom: 1px solid var(--line); }

.rc-head .stackav .av { width: 28px; height: 28px; font-size: 10px; }

.rc-sec:last-child { border-bottom: 0; }
