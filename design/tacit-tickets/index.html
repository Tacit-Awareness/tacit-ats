<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the theme before first paint: the saved choice, else the system's
      try {
        var t = localStorage.getItem("tacit-theme") || "system"
        var v = t === "classic-dark" ? "classic" : t === "max-light" ? "max" : "plain"
        if (t !== "classic-dark" && t !== "dark" && t !== "light" && t !== "max-light") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
          v = t === "dark" ? "classic" : "plain"
        }
        t = t === "classic-dark" ? "dark" : t === "max-light" ? "light" : t
        document.documentElement.dataset.theme = t
        document.documentElement.dataset.variant = v
        document.documentElement.classList.toggle("dark", t === "dark")
      } catch (e) {}
    </script>
    <title>Tacit</title>
      <link rel="icon" type="image/svg+xml" href="/tacit-mark.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
