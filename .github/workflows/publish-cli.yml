name: Publish tats

# Pushing a tag cli-v<version> publishes apps/cli to npm as @tacitawareness/tats.
# The tag must match apps/cli/package.json's version (and version.ts, which
# version.test.ts keeps equal). Needs the NPM_TOKEN secret: an npm automation
# token that can publish to the @tacitawareness scope. No --provenance: npm
# only attests builds from public repositories, and this one is private.
on:
  push:
    tags: ['cli-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          test "${GITHUB_REF_NAME}" = "cli-v${version}" || { echo "tag ${GITHUB_REF_NAME} is not cli-v${version}"; exit 1; }
      - run: pnpm --filter @tacitawareness/tats typecheck
      - run: pnpm exec vitest run apps/cli
      - run: pnpm --filter @tacitawareness/tats build
      - run: npm publish
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
