name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build before typecheck: cross-package type resolution goes through
      # each package's dist/index.d.ts, which only exists after a build.
      # Dummy Supabase env: apps/internal constructs its client at module
      # scope, so next build's page-data collection needs the vars to exist;
      # every page is dynamic, so nothing actually connects at build time.
      - run: pnpm build
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: ci-dummy
          SUPABASE_SECRET_KEY: ci-dummy
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build edge bundle
        run: pnpm build:functions
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The handler is the one file outside every tsconfig -- deno check is
      # the only typecheck it gets. Runs after the bundle build since it
      # imports ./_core.js.
      - name: Typecheck edge handler (Deno)
        run: deno check index.ts
        working-directory: packages/db/supabase/functions/granola-webhook
      # Pinned to the version the local dev stack is verified against --
      # newer CLIs changed local API-key handling; bump deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.48.3
      # Fresh stack applies every migration from scratch -- this is also the
      # "do the migrations still replay cleanly in order" validation.
      - name: Start local Supabase
        run: supabase start
        working-directory: packages/db
      - run: pnpm test:integration

  # A migration created before the newest one already on main would be
  # refused by `supabase db push` AFTER merge -- fail here instead, so the
  # author renames the file to a fresh timestamp while it's still a PR.
  migration-order:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: New migrations must sort after everything on main
        run: |
          latest_main=$(git ls-tree -r --name-only origin/main -- packages/db/supabase/migrations/ | grep '\.sql$' | sort | tail -1 || true)
          if [ -z "$latest_main" ]; then
            echo "No migrations on main yet -- nothing to order against."
            exit 0
          fi
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [[ "$(basename "$f")" < "$(basename "$latest_main")" ]]; then
              echo "::error file=$f::$(basename "$f") sorts before $(basename "$latest_main"), which is already on main. supabase db push would refuse this after merge. Rename it to a fresh timestamp: 'supabase migration new <name>' and move your SQL into the new file."
              fail=1
            fi
          done < <(git diff --name-only --diff-filter=A origin/main...HEAD -- 'packages/db/supabase/migrations/*.sql')
          [ "$fail" = 0 ] && echo "Migration ordering OK."
          exit $fail

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: qlqebxtjzcotiwgdnukj
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret not set -- skipping deploy. Add it (and SUPABASE_DB_PASSWORD) in repo settings to enable CD."
            echo "have_creds=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_creds=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.have_creds == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.have_creds == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.creds.outputs.have_creds == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.have_creds == 'true'
        with:
          version: latest
      - name: Build edge bundle
        if: steps.creds.outputs.have_creds == 'true'
        run: pnpm build:functions
      - name: Deploy granola-webhook
        if: steps.creds.outputs.have_creds == 'true'
        run: supabase functions deploy granola-webhook --no-verify-jwt --project-ref "$PROJECT_REF"
        working-directory: packages/db
      # No --include-all: an out-of-order migration that somehow reached main
      # fails loudly here rather than being applied out of order.
      - name: Push migrations
        if: steps.creds.outputs.have_creds == 'true' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
        working-directory: packages/db
