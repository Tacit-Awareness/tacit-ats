name: CI

# Pull requests only: a merge to main deploys through Vercel, and the
# squash-merge lands the tree that just passed. Actions minutes are shared
# with Tacit-Awareness (private repos, 2,000 min/month).
on:
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:build
      - run: pnpm typecheck
      - run: pnpm test
      # Integration tests need Tacit-Awareness's migrations for the local
      # stack, a private repo this workflow cannot check out yet. Run them
      # locally (CLAUDE.md, Commands).
