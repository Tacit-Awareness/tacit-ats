<h2>Reset your tATS password</h2>
<p>Someone asked to reset the password for this email address on tATS.</p>
<p><a href="{{ .SiteURL }}/client/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/client/set-password">Choose a new password</a></p>
<p>The link works once and expires in an hour. If you didn't ask for this, you can ignore this email: your password stays the same.</p>
